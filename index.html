<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Produção - PMCD</title>
<meta name="description" content="Sistema de diário de produção, reconhecimento de imóveis e relatórios do Programa Municipal de Controle da Dengue (PMCD)." />
<meta property="og:title" content="Diário de Produção - PMCD" />
<meta property="og:description" content="Sistema de diário de produção, reconhecimento de imóveis e relatórios do Programa Municipal de Controle da Dengue (PMCD)." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body, input, select, textarea, button, table, th, td {
    font-family: 'Merriweather', Georgia, serif;
  }
  body { margin: 15px; background: #f4f4f4; color: #222; }
  h1 { text-align: center; margin: 10px 0 4px 0; color: #333; font-size: 22px; }

  .status-nuvem-container { text-align: center; margin-bottom: 15px; }
  .badge-nuvem { display: inline-block; padding: 5px 14px; font-size: 12px; font-weight: bold; border-radius: 20px; transition: 0.3s; }
  .badge-nuvem.online { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .badge-nuvem.offline { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .badge-nuvem.pendente { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }

  .abas { display: flex; justify-content: center; gap: 5px; margin-bottom: 0; flex-wrap: wrap; }
  .aba { padding: 10px 14px; font-size: 12px; font-weight: bold; border: none; border-radius: 8px 8px 0 0; cursor: pointer; background: #ccc; color: #333; transition: 0.2s; }
  .aba:hover { background: #bbb; }
  .aba.ativa { background: #333; color: #fff; }

  .painel { background: #fff; border: 3px solid #333; border-radius: 0 0 8px 8px; padding: 12px; }
  .painel.oculto { display: none; }

  .barra-topo { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  button.acao { padding: 10px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; background: #333; color: #fff; transition: 0.2s; }
  button.acao:hover { background: #555; }
  button.sucesso { background: #2e7d32; }
  button.sucesso:hover { background: #388e3c; }
  button.info { background: #0277bd; }
  button.info:hover { background: #0288d1; }
  button.perigo { background: #b00020; }
  button.perigo:hover { background: #d32f2f; }

  .semana { background: #fff; border: 3px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 25px; overflow-x: auto; }
  .semana-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; padding: 10px; background: #333; color: #fff; border-radius: 5px; flex-wrap: wrap; }
  .semana-header label { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .select-semana { padding: 6px 12px; font-size: 14px; font-weight: bold; border-radius: 4px; border: 2px solid #fff; background: #fff; color: #333; cursor: pointer; outline: none; transition: 0.2s; }
  .select-semana.invalido { border-color: #ff5252; background: #ffebee; }
  .status-semana { font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
  .status-pendente { background: #ffd54f; color: #333; }
  .status-ok { background: #4caf50; color: #fff; }

  .container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
  .dia { background: #fafafa; border: 2px solid #666; border-radius: 6px; padding: 8px; min-width: 340px; flex-shrink: 0; transition: all 0.25s ease; position: relative; }
  .dia h3 { text-align: center; margin: 0 0 6px 0; padding: 6px; background: #666; color: #fff; border-radius: 4px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dia h3 input[type="date"] { border: 2px solid #ccc; border-radius: 3px; padding: 2px 4px; font-size: 12px; background: #fff; color: #333; cursor: pointer; outline: none; }
  .dia h3 input[type="date"].obrigatorio { border-color: #e53935; background: #fff8e1; }
  .aviso-bloqueio-dia { font-size: 11px; text-align: center; padding: 4px; margin-bottom: 6px; border-radius: 3px; font-weight: bold; }
  .aviso-bloqueio-dia.bloqueado { background: #ffebee; color: #c62828; border: 1px dashed #ef9a9a; }
  .aviso-bloqueio-dia.liberado { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .dia.bloqueado { background: #f1f1f1; border-color: #bbb; }
  .dia.bloqueado h3 { background: #888; }
  .dia.bloqueado table { opacity: 0.45; pointer-events: none; user-select: none; }
  .dia.bloqueado input { cursor: not-allowed; }

  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #999; padding: 3px; text-align: center; }
  th { background: #e0e0e0; font-weight: bold; font-size: 11px; }
  input { width: 100%; border: none; outline: none; text-align: center; font-size: 12px; background: transparent; box-sizing: border-box; }
  input:focus { background: #fff9c4; }
  .agente input { text-align: left; }
  .quarteirao input { text-align: center; }
  input.num.vazio-visual { color: #999; }
  td.calculado.vazio-visual { color: #999; }
  .total { font-weight: bold; background: #f0f0f0; }
  .col-agente { width: 70px; }
  .col-quart  { width: 60px; }
  .col-num    { width: 28px; }
  .col-total  { width: 38px; }
  .rodape-dia { margin-top: 6px; font-size: 12px; font-weight: bold; text-align: right; color: #333; }
  .aviso { text-align: center; font-size: 12px; font-weight: bold; color: #0277bd; margin: -5px 0 10px 0; min-height: 16px; transition: opacity 0.3s; }

  .tabela-semanal { max-width: 700px; margin: 0 auto; }
  .tabela-semanal table { font-size: 13px; }
  .tabela-semanal th, .tabela-semanal td { padding: 5px 4px; }
  .tabela-semanal .col-quart-sem { width: 130px; text-align: center; }
  .tabela-semanal .col-num-sem   { width: 50px; }
  .tabela-semanal .col-total-sem { width: 60px; }
  .tabela-semanal tr.linha-total td { background: #333; color: #fff; font-weight: bold; font-size: 14px; }
  .tabela-semanal td.calculado { font-weight: bold; }

  .tabela-total { max-width: 1100px; margin: 0 auto; }
  .tabela-total table { font-size: 13px; }
  .tabela-total th, .tabela-total td { padding: 5px 4px; }
  .tabela-total .col-data  { width: 100px; }
  .tabela-total .col-ag    { width: 110px; text-align: left; }
  .tabela-total .col-quart { width: 100px; text-align: center; }
  .tabela-total .col-num   { width: 55px; }
  .tabela-total .col-total { width: 65px; }
  .tabela-total tr.linha-total td { background: #333; color: #fff; font-weight: bold; font-size: 14px; }
  .tabela-total thead th { background: #555; color: #fff; }

  .tabela-informados { max-width: 1400px; margin: 0 auto; }
  .tabela-informados table { font-size: 14px; }
  .tabela-informados th, .tabela-informados td { padding: 7px 5px; }
  .tabela-informados .col-agente-informado { width: 210px; text-align: left; font-size: 12px; }
  .tabela-informados .col-quart { width: 130px; text-align: center; }
  .tabela-informados .col-num   { width: 55px; }
  .tabela-informados .col-total { width: 65px; }
  .tabela-informados .col-data-informado { width: 110px; text-align: center; }
  .tabela-informados tr.linha-total td { background: #333; color: #fff; font-weight: bold; font-size: 15px; }
  .tabela-informados thead th { background: #555; color: #fff; font-size: 13px; }
  .tabela-informados td.calculado { font-weight: bold; }

  .pagina-a4 { background: #fff; border: 2px dashed #999; border-radius: 6px; padding: 14px; margin-bottom: 20px; box-sizing: border-box; }
  .pagina-a4 .titulo-pagina { text-align: center; font-size: 13px; color: #666; margin-bottom: 8px; font-style: italic; }
  .titulo-principal { text-align: center; font-size: 15px; font-weight: bold; color: #000; margin: 4px 0 2px 0; letter-spacing: 0.3px; }
  .subtitulo { text-align: center; font-size: 13px; font-weight: bold; color: #333; margin: 0 0 8px 0; padding-bottom: 6px; border-bottom: 2px solid #333; letter-spacing: 0.2px; }

  .cabecalho-tabelas { background: #f0f0f0; border: 1px solid #333; border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
  .cabecalho-tabelas .campo { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .cabecalho-tabelas .campo label { font-weight: bold; color: #333; white-space: nowrap; }
  .cabecalho-tabelas .campo input { border: none; border-bottom: 1px solid #666; background: #fff; padding: 3px 5px; font-size: 12px; text-align: left; border-radius: 2px 2px 0 0; min-width: 0; }
  .cabecalho-tabelas .campo input:focus { background: #fff9c4; }
  .cabecalho-tabelas .campo-total { grid-column: span 4; justify-content: center; background: #333; color: #fff; padding: 4px 8px; border-radius: 3px; font-weight: bold; font-size: 12px; margin-top: 2px; }
  .cabecalho-tabelas .campo-total span { color: #ffd54f; margin-left: 5px; }
  .cabecalho-tabelas .campo-quarteirao-fixo input { background: #e0f7fa; font-weight: bold; border-bottom: 2px solid #0277bd; text-align: center; }

  .dupla-tabelas { display: flex; gap: 12px; justify-content: center; align-items: flex-start; margin-bottom: 8px; }
  .tabela-dupla { flex: 1 1 0; min-width: 0; }
  .tabela-dupla table { font-size: 10px; table-layout: fixed; width: 100%; }
  .tabela-dupla th, .tabela-dupla td { border: 1px solid #333; padding: 2px 1px; text-align: center; height: 18px; line-height: 1.1; overflow: hidden; word-break: break-word; }
  .tabela-dupla td input { width: 100%; height: 100%; border: none; outline: none; text-align: center; font-size: 10px; background: transparent; padding: 0; margin: 0; box-sizing: border-box; font-family: inherit; }
  .tabela-dupla td input:focus { background: #fff9c4; }
  .tabela-dupla td.col-q input { text-align: center; padding-left: 0; }
  .tabela-dupla thead th { background: #555; color: #fff; font-size: 9px; font-weight: bold; }
  .tabela-dupla .col-num-linha { width: 8%; font-weight: bold; background: #f5f5f5; }
  .tabela-dupla .col-q { width: 28%; text-align: center; padding-left: 0; }
  .tabela-dupla .col-n { width: 9%; }
  .tabela-dupla .col-t { width: 12%; }
  .tabela-dupla tr.linha-total td { background: #333; color: #fff; font-weight: bold; }
  .tabela-dupla td.calculado { font-weight: bold; }
  .tabela-dupla td.vazio { color: #ccc; }

  .barra-botoes-tabelas { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }

  .rodape-pagina { margin-top: 14px; padding-top: 10px; border-top: 1px solid #333; display: flex; justify-content: space-around; gap: 20px; flex-wrap: wrap; }
  .rodape-pagina .campo-rodape { display: flex; align-items: center; gap: 6px; font-size: 12px; flex: 1 1 40%; min-width: 200px; }
  .rodape-pagina .campo-rodape label { font-weight: bold; color: #333; white-space: nowrap; }
  .rodape-pagina .campo-rodape input { border: none; border-bottom: 1px solid #333; background: #fff; padding: 3px 6px; font-size: 12px; text-align: left; flex: 1; border-radius: 2px 2px 0 0; }
  .rodape-pagina .campo-rodape input:focus { background: #fff9c4; }

  .btn-status-mini { padding: 1px 5px; font-size: 9px; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; margin: 0 1px; transition: 0.15s; }
  .btn-sim { background: #2e7d32; color: #fff; }
  .btn-sim:hover { background: #43a047; }
  .btn-nao { background: #c62828; color: #fff; }
  .btn-nao:hover { background: #e53935; }
  .btn-voltar { background: #1565c0; color: #fff; }
  .btn-voltar:hover { background: #1e88e5; }

  .info-vazia { text-align: center; color: #999; font-size: 12px; padding: 10px; font-style: italic; }
  .contador { text-align: center; font-size: 12px; color: #555; margin-bottom: 10px; font-weight: bold; }

  .barra-filtro { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
  .barra-filtro label { font-size: 13px; font-weight: bold; color: #333; }
  .barra-filtro input { padding: 6px 8px; font-size: 13px; border: 1px solid #999; border-radius: 4px; font-family: inherit; }

  .info-regra-bases {
    text-align: center;
    font-size: 11px;
    color: #01579b;
    background: #e1f5fe;
    border: 1px dashed #0277bd;
    border-radius: 4px;
    padding: 7px 10px;
    margin-bottom: 10px;
  }
  .info-regra-bases b { color: #01396b; }

  /* ===== Boletins de Reconhecimento ===== */
  .tabela-boletins-imoveis th,
  .tabela-boletins-imoveis td { font-size: 11px; padding: 3px 1px; height: 24px; line-height: 1.2; }
  .tabela-boletins-imoveis th { text-align: center; font-size: 10px; white-space: nowrap; }
  .tabela-boletins-imoveis .col-rua    { width: 30%; }
  .tabela-boletins-imoveis .col-numero { width: 8%; }
  .tabela-boletins-imoveis .col-comp   { width: 22%; }
  .tabela-boletins-imoveis .col-seq    { width: 13%; }
  .tabela-boletins-imoveis .col-tipo   { width: 15%; }
  .tabela-boletins-imoveis td.col-rua input { text-align: left; padding-left: 3px; }
  .tabela-boletins-imoveis td.col-comp input { text-align: center; padding-left: 0; }
  .tabela-boletins-imoveis td input { font-size: 11px; }

  .legenda-codigos { text-align: center; font-size: 10px; color: #555; margin-bottom: 6px; padding: 4px 6px; background: #fff8e1; border: 1px dashed #ffb300; border-radius: 3px; line-height: 1.4; }
  .legenda-codigos b { color: #333; }
  .legenda-colagem { text-align: center; font-size: 10px; color: #0277bd; margin-bottom: 6px; padding: 3px 6px; background: #e1f5fe; border: 1px dashed #0277bd; border-radius: 3px; line-height: 1.3; }

  .tabela-boletins-imoveis td.col-tipo input { text-align: center; text-transform: uppercase; font-weight: bold; font-size: 12px; letter-spacing: 0.5px; }
  .tabela-boletins-imoveis td.col-tipo input.invalido { background: #ffebee; color: #c62828; }

  .tabela-boletins-resumo { font-size: 12px; }
  .tabela-boletins-resumo th, .tabela-boletins-resumo td { padding: 6px 8px; height: 32px; font-size: 13px; border: 1px solid #333; }
  .tabela-boletins-resumo thead th { background: #555; color: #fff; font-size: 12px; text-align: center; }
  .tabela-boletins-resumo .col-desc { text-align: left; width: 65%; }
  .tabela-boletins-resumo .col-qtd  { width: 35%; text-align: center; }
  .tabela-boletins-resumo td input { width: 100%; border: none; outline: none; text-align: center; font-size: 13px; background: transparent; padding: 0; margin: 0; box-sizing: border-box; font-family: inherit; }
  .tabela-boletins-resumo td input[readonly] { background: #f0f0f0; cursor: default; font-weight: bold; color: #222; }
  .tabela-boletins-resumo tr.linha-total td { background: #333; color: #fff; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tabela-boletins-resumo tr.linha-total input { color: #fff; font-weight: bold; }
  .tabela-boletins-resumo tr.linha-total input[readonly] { background: transparent; color: #fff; }

  /* ===== Blocos por quarteirão ===== */
  .bloco-quarteirao { border: 3px solid #0277bd; border-radius: 8px; padding: 12px; margin-bottom: 20px; background: #f5fbff; }
  .bloco-quarteirao.oculto-por-selecao { display: none !important; }
  .titulo-bloco-quarteirao { background: #0277bd; color: #fff; padding: 8px 12px; border-radius: 5px; font-weight: bold; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .titulo-bloco-quarteirao.legado { background: #616161; }
  .badge-paginas { background: #fff; color: #0277bd; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  .barra-botoes-quarteirao { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .barra-botoes-quarteirao button { padding: 6px 12px; font-size: 12px; }

  .totais-quarteirao { margin: 0 0 10px; padding: 8px 12px; background: #e1f5fe; border: 2px solid #0277bd; border-radius: 5px; font-size: 12px; color: #01579b; text-align: center; }
  .totais-quarteirao b { color: #01579b; }

  .aviso-sincronizacao { text-align: center; font-size: 11px; color: #0277bd; margin-bottom: 10px; font-style: italic; }

  .barra-selecao-quarteirao {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #0277bd;
    border-radius: 6px;
    flex-wrap: wrap;
  }
  .barra-selecao-quarteirao label { color: #fff; font-weight: bold; font-size: 14px; }
  .barra-selecao-quarteirao select {
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    border: 2px solid #fff; border-radius: 5px; background: #fff;
    color: #333; cursor: pointer; outline: none; min-width: 280px;
  }
  .barra-selecao-quarteirao select:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }

  .bloco-quarteirao .pagina-a4 { min-height: 1080px; display: flex; flex-direction: column; }
  .bloco-quarteirao .pagina-a4 .rodape-pagina { margin-top: auto; }

  .tabela-resumo-integrada td.auto { background: #f8fbff; }
  .tabela-resumo-integrada td.legacy { background: #fffbea; }
  .tabela-resumo-integrada td.auto .badge-auto {
    display: inline-block;
    font-size: 8px;
    background: #0277bd;
    color: #fff;
    padding: 0 4px;
    border-radius: 3px;
    margin-left: 3px;
    vertical-align: middle;
  }

  /* ===== ESTILOS PARA EXPORTAÇÃO DE PDF DE ALTA RESOLUÇÃO (SEM CORTES) ===== */
  .pdf-export-wrapper {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 194mm !important;
    max-width: 194mm !important;
    background: #ffffff !important;
    z-index: -9999 !important;
    pointer-events: none !important;
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .pdf-export-wrapper.landscape {
    width: 280mm !important;
    max-width: 280mm !important;
  }
  .pdf-export-wrapper .bloco-quarteirao { border: none !important; padding: 0 !important; margin: 0 !important; background: transparent !important; }
  .pdf-export-wrapper .titulo-bloco-quarteirao,
  .pdf-export-wrapper .barra-botoes-quarteirao,
  .pdf-export-wrapper .legenda-codigos,
  .pdf-export-wrapper .legenda-colagem,
  .pdf-export-wrapper .titulo-pagina,
  .pdf-export-wrapper .btn-status-mini,
  .pdf-export-wrapper .barra-botoes-tabelas,
  .pdf-export-wrapper .barra-filtro,
  .pdf-export-wrapper .contador,
  .pdf-export-wrapper .barra-selecao-quarteirao,
  .pdf-export-wrapper .info-regra-bases,
  .pdf-export-wrapper .aviso-sincronizacao { display: none !important; }

  .pdf-export-wrapper .pagina-a4 {
    width: 194mm !important;
    max-width: 194mm !important;
    height: 279mm !important;
    max-height: 279mm !important;
    min-height: 270mm !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
    padding: 2.5mm 3mm !important;
    margin: 0 !important;
    border: none !important;
    background: #fff !important;
    display: flex !important;
    flex-direction: column !important;
    page-break-inside: avoid !important;
    page-break-after: always !important;
  }
  .pdf-export-wrapper .pagina-a4:last-child { page-break-after: auto !important; }
  .pdf-export-wrapper .pagina-a4 + .pagina-a4 { page-break-before: always !important; }

  .pdf-export-wrapper .titulo-principal { font-size: 13px !important; margin: 1px 0 2px 0 !important; text-align: center !important; }
  .pdf-export-wrapper .subtitulo { font-size: 11px !important; margin: 0 0 5px 0 !important; padding-bottom: 3px !important; text-align: center !important; }
  .pdf-export-wrapper .cabecalho-tabelas { padding: 4px 6px !important; gap: 4px 8px !important; margin-bottom: 5px !important; width: 100% !important; box-sizing: border-box !important; }

<script>

  const STORAGE_SELECAO_BOLETINS = "diario_boletins_selecao";

  let ultimoTimestampLocal = 0;

  let statusQuarteiroes = {};
  let paginas = { andamento: 1, concluidos: 1, boletins: 1, resumo: 1, bases: 1, coflagrados: 1, resumogeral: 1 };
  let cabecalhos = { andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} };
  let rodapes = { andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} };

    try {
      const saved = localStorage.getItem(STORAGE_SELECAO_BOLETINS);
      return saved !== null ? saved : null;
    } catch (e) { return null; }
  })();

  const CAMPOS_CABECALHO = [
    { id: "uf",          label: "Unid. Federal" },
    { id: "distrito",    label: "Distrito" },
    { id: "municipio",   label: "Município" },
    { id: "localidade",  label: "Localidade" },

  ];

  const CODIGOS_TIPO_VALIDOS = ["R", "C", "TB", "PE", "O"];
  const LINHAS_IMOVEIS_BOLETINS = 25;

  function normalizarTipoBoletim(valor) {
    return String(valor || "").toUpperCase().replace(/[^A-Z]/g, "");
  }
  function isTipoBoletimValido(valor) {
    const v = String(valor || "").trim().toUpperCase();
    return v === "" || CODIGOS_TIPO_VALIDOS.indexOf(v) !== -1;
  }

  function parseIntSeguro(valor) {
    if (valor === null || valor === undefined) return NaN;
    const s = String(valor).trim();
    if (s === "" || s === "00") { const num = parseInt(s, 10); return isNaN(num) ? NaN : num; }
    const n = parseInt(s, 10); return isNaN(n) ? NaN : n;
  }

  function formatarInteiro2Digitos(valor) {
    if (valor === null || valor === undefined || valor === "") return "00";
    const n = parseInt(String(valor).replace(/\D/g, ""), 10);
    if (isNaN(n)) return "00";
    if (n === 0) return "00";
    return String(n).padStart(2, "0");
  }

  function formatarSeq2Digitos(valor) {
    if (valor === null || valor === undefined || valor === "") return "";
    const s = String(valor).trim();
    if (/^\d+$/.test(s)) {
      const n = parseInt(s, 10);
      return isNaN(n) ? s : String(n).padStart(2, "0");
    }
    return s;
  }

  function formatarIdentificador2Digitos(valor) {
    if (valor === null || valor === undefined || valor === "") return "";
    const s = String(valor).trim();
    if (/^\d+$/.test(s)) {
      const n = parseInt(s, 10);
      return isNaN(n) ? s : String(n).padStart(2, "0");
    }
    return s;
  }

  function aplicarFormatacaoInicialNosInputsNumericos(root) {
    const scope = root || document;
    scope.querySelectorAll("input.num").forEach(inp => {
      if (inp.value === "" || inp.value === undefined) {
        inp.value = "00"; inp.dataset.realVazio = "1"; inp.classList.add("vazio-visual");
      } else {
        const v = inp.value.trim();
        if (v === "" || v === "0") {
          if (v === "") { inp.value = "00"; inp.dataset.realVazio = "1"; inp.classList.add("vazio-visual"); }
          else { inp.value = "00"; delete inp.dataset.realVazio; inp.classList.remove("vazio-visual"); }
        } else {
          const n = parseInt(v.replace(/\D/g, ""), 10);
          if (!isNaN(n)) {
            inp.value = String(n).padStart(2, "0");
            delete inp.dataset.realVazio; inp.classList.remove("vazio-visual");
          } else { inp.value = "00"; inp.dataset.realVazio = "1"; inp.classList.add("vazio-visual"); }
        }
      }
    });
  }

  const TITULO_PRINCIPAL = "Programa Municipal de Controle da Dengue - PMCD";
  const SUBTITULOS = {
    andamento: "Resumo de Reconhecimento",
    concluidos: "Resumo de Reconhecimento",

  };

  let dbRef = null;
  let nuvemAtiva = false;

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    dbRef = db.ref("diario_producao_pmcd");
    nuvemAtiva = true;
  } catch (err) { console.error("Falha ao inicializar Firebase:", err); }

  function monitorarConexaoNuvem() {
    const badge = document.getElementById("statusNuvem");
    if (!nuvemAtiva || !dbRef) {
      badge.className = "badge-nuvem pendente";
      badge.textContent = "⚠️ Nuvem não configurada";
      return;
    }
    firebase.database().ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        badge.className = "badge-nuvem online"; badge.textContent = "☁️ Nuvem Conectada (Tempo Real)";
      } else {
        badge.className = "badge-nuvem offline"; badge.textContent = "⚡ Modo Offline (Salvo Localmente)";
      }
    });
    dbRef.on("value", (snapshot) => {
      const dadosNuvem = snapshot.val();
      if (!dadosNuvem) return;
      if (dadosNuvem.timestamp && dadosNuvem.timestamp === ultimoTimestampLocal) return;
      aplicarDadosRemotos(dadosNuvem);
    });
  }

  function aplicarDadosRemotos(dados) {
    try {
      if (!dados || !dados.semanas) return;
      statusQuarteiroes = dados.statusQuarteiroes || {};
      paginas = Object.assign({ andamento: 1, concluidos: 1, boletins: 1, resumo: 1, bases: 1, coflagrados: 1, resumogeral: 1 }, dados.paginas);
      cabecalhos = Object.assign({ andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} }, dados.cabecalhos);
      rodapes = Object.assign({ andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} }, dados.rodapes);
      dadosFormularios = Object.assign({ boletins: { porQuarteirao: {} }, resumo: {}, bases: {}, coflagrados: {} }, dados.dadosFormularios);

      garantirEstruturaBoletins();

      localStorage.setItem(STORAGE_KEY, JSON.stringify(dados.semanas));
      salvarStatus(); salvarPaginas(); salvarCabecalhos(); salvarRodapes(); salvarFormularios();

      document.getElementById("semanas").innerHTML = "";
      semanaCount = 0;
      dados.semanas.forEach(s => criarSemana(s));

      recalcular(); atualizarResumoSemanal(); atualizarTotalImoveis(); atualizarInformados();
      atualizarAndamento(); atualizarConcluidos(); renderizarFormularioBoletins();
      renderizarResumoIntegrado();
      renderizarBasesIntegrado();
      renderizarCoflagrados();
      renderizarResumoGeral();

      mostrarAviso("🔄 Sincronizado com outro aparelho!");
    } catch (e) { console.error("Erro na sincronização remota:", e); }
  }

  function trocarAba(nome) {
    document.querySelectorAll(".aba").forEach(b => b.classList.toggle("ativa", b.dataset.aba === nome));
    ["diario", "semanal", "total", "informados", "andamento", "concluidos", "boletins", "resumo", "bases", "coflagrados", "resumogeral"].forEach(p => {
      const el = document.getElementById("painel-" + p);
      if (el) el.classList.toggle("oculto", p !== nome);
    });
    if (nome === "semanal") atualizarResumoSemanal();
    if (nome === "total") atualizarTotalImoveis();
    if (nome === "informados") atualizarInformados();
    if (nome === "andamento") atualizarAndamento();
    if (nome === "concluidos") atualizarConcluidos();
    if (nome === "boletins") renderizarFormularioBoletins();
    if (nome === "resumo") renderizarResumoIntegrado();
    if (nome === "bases") renderizarBasesIntegrado();
    if (nome === "coflagrados") renderizarCoflagrados();
    if (nome === "resumogeral") renderizarResumoGeral();
  }

  function criarSemana(dadosSemana) {
    semanaCount++;
    const idSemana = dadosSemana ? dadosSemana.id : semanaCount;
    if (dadosSemana) semanaCount = Math.max(semanaCount, idSemana);

    const divSemana = document.createElement("div");
    divSemana.className = "semana";
    divSemana.dataset.semana = idSemana;

    const header = document.createElement("div");
    header.className = "semana-header";

    const labelSem = document.createElement("label");
    labelSem.innerHTML = `📅 <span>Semana:</span>`;
    header.appendChild(labelSem);

    const selectSem = document.createElement("select");
    selectSem.className = "select-semana invalido";
    selectSem.id = `select-semana-${idSemana}`;

    const optVazio = document.createElement("option");
    optVazio.value = ""; optVazio.textContent = "-- Selecione a Semana --";
    selectSem.appendChild(optVazio);

    for (let w = 1; w <= 53; w++) {
      const numFmt = String(w).padStart(2, "0");
      const opt = document.createElement("option");
      opt.value = `Semana ${numFmt}`;
      opt.textContent = `Semana ${numFmt} (SE ${numFmt})`;
      selectSem.appendChild(opt);
    }

    const optCustom = document.createElement("option");
    optCustom.value = "__custom__"; optCustom.textContent = "✏️ Outro nome personalizado...";
    selectSem.appendChild(optCustom);

    if (dadosSemana && dadosSemana.titulo) {
      const existe = Array.from(selectSem.options).some(o => o.value === dadosSemana.titulo);
      if (!existe && dadosSemana.titulo.trim() !== "") {
        const customOpt = document.createElement("option");
        customOpt.value = dadosSemana.titulo; customOpt.textContent = dadosSemana.titulo;
        selectSem.insertBefore(customOpt, optCustom);
      }
      selectSem.value = dadosSemana.titulo;
    }

    selectSem.addEventListener("change", () => {
      if (selectSem.value === "__custom__") {
        const digitado = prompt("Digite a identificação da semana:");
        if (digitado && digitado.trim()) {
          const novaOpt = document.createElement("option");
          novaOpt.value = digitado.trim(); novaOpt.textContent = digitado.trim();
          selectSem.insertBefore(novaOpt, optCustom);
          selectSem.value = digitado.trim();
        } else { selectSem.value = ""; }
      }
      verificarBloqueioSemana(divSemana);
      salvarComAtraso();
    });

    header.appendChild(selectSem);

    const statusSemana = document.createElement("span");
    statusSemana.className = "status-semana status-pendente";
    statusSemana.textContent = "⚠️ Seleção Pendente";
    header.appendChild(statusSemana);

    divSemana.appendChild(header);

    const container = document.createElement("div");
    container.className = "container";

    dias.forEach((dia, dIdx) => {
      const bloco = document.createElement("div");
      bloco.className = "dia bloqueado";
      bloco.dataset.diaIndex = dIdx;

      const tituloDia = document.createElement("h3");
      const spanNome = document.createElement("span");
      spanNome.textContent = dia;
      tituloDia.appendChild(spanNome);

      const inputData = document.createElement("input");
      inputData.type = "date";
      inputData.id = `data-${idSemana}-${dIdx}`;
      inputData.className = "obrigatorio";
      inputData.title = "Data obrigatória deste dia";
      if (dadosSemana && dadosSemana.datas && dadosSemana.datas[dIdx]) inputData.value = dadosSemana.datas[dIdx];

      inputData.addEventListener("change", () => { verificarBloqueioSemana(divSemana); salvarComAtraso(); });

      tituloDia.appendChild(inputData);
      bloco.appendChild(tituloDia);

      const avisoDia = document.createElement("div");
      avisoDia.className = "aviso-bloqueio-dia bloqueado";
      avisoDia.textContent = "🔒 Selecione a semana e a data acima";
      bloco.appendChild(avisoDia);

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const trHead = document.createElement("tr");
      colunas.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        if (col === "Agente") th.className = "col-agente";
        else if (col === "Quarteirão") th.className = "col-quart";
        else if (col === "Total") th.className = "col-total";
        else th.className = "col-num";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (let i = 0; i < linhas; i++) {
        const tr = document.createElement("tr");
        colunas.forEach(col => {
          const td = document.createElement("td");
          if (col === "Total") {
            const idR  = `r-${idSemana}-${dIdx}-${i}`;
            const idC  = `c-${idSemana}-${dIdx}-${i}`;
            const idTB = `tb-${idSemana}-${dIdx}-${i}`;
            const idO  = `o-${idSemana}-${dIdx}-${i}`;
            td.className = "total";
            td.innerHTML = `<input type="text" readonly disabled data-formula="${idR},${idC},${idTB},${idO}">`;
          } else {
            const inp = document.createElement("input");
            inp.type = "text";
            inp.disabled = true;
            const mapa = { "R": "r", "C": "c", "TB": "tb", "PE": "pe", "O": "o" };
            if (col === "Agente") { inp.id = `ag-${idSemana}-${dIdx}-${i}`; td.className = "agente col-agente"; }
            else if (col === "Quarteirão") { inp.id = `q-${idSemana}-${dIdx}-${i}`; td.className = "quarteirao col-quart"; }
            else { inp.id = `${mapa[col]}-${idSemana}-${dIdx}-${i}`; inp.classList.add("num"); inp.inputMode = "numeric"; td.className = "col-num"; }
            if (dadosSemana && dadosSemana.valores && dadosSemana.valores[inp.id] !== undefined) inp.value = dadosSemana.valores[inp.id];
            td.appendChild(inp);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      bloco.appendChild(table);

      const rodape = document.createElement("div");
      rodape.className = "rodape-dia";
      rodape.innerHTML = `Total do dia: <span data-totaldia="${idSemana}-${dIdx}">00</span>`;
      bloco.appendChild(rodape);

      bloco.addEventListener("click", (e) => {
        const selSem = divSemana.querySelector(".select-semana");
        const inpD = bloco.querySelector('input[type="date"]');
        const semanaValida = selSem && selSem.value.trim() !== "";
        const dataValida = inpD && inpD.value.trim() !== "";
        if (!semanaValida || !dataValida) {
          if (e.target !== inpD && e.target !== selSem) {
            if (!semanaValida) { mostrarAviso("⚠️ Seleção obrigatória: Escolha a Semana no topo antes de fazer os lançamentos!"); selSem.focus(); }
            else if (!dataValida) { mostrarAviso(`⚠️ Data obrigatória: Preencha a data de ${dia} para liberar os lançamentos!`); inpD.focus(); }
          }
        }
      });

      container.appendChild(bloco);
    });

    divSemana.appendChild(container);
    document.getElementById("semanas").appendChild(divSemana);
    aplicarFormatacaoInicialNosInputsNumericos(divSemana);
    verificarBloqueioSemana(divSemana);

  function verificarBloqueioSemana(divSemana) {
    const selSem = divSemana.querySelector(".select-semana");
    const statusSem = divSemana.querySelector(".status-semana");
    const semanaValida = selSem && selSem.value.trim() !== "";
    if (statusSem) {
      if (semanaValida) {
        statusSem.className = "status-semana status-ok"; statusSem.textContent = "✓ Semana Definida";
        selSem.classList.remove("invalido");
      } else {
        statusSem.className = "status-semana status-pendente"; statusSem.textContent = "⚠️ Seleção da Semana Pendente";
        selSem.classList.add("invalido");
      }
    }
    divSemana.querySelectorAll(".dia").forEach(bloco => {
      const inputData = bloco.querySelector('input[type="date"]');
      const avisoDia = bloco.querySelector(".aviso-bloqueio-dia");
      const dataValida = inputData && inputData.value.trim() !== "";
      const liberado = semanaValida && dataValida;
      bloco.classList.toggle("bloqueado", !liberado);
      if (inputData) inputData.classList.toggle("obrigatorio", !dataValida);
      if (avisoDia) {
        if (liberado) { avisoDia.className = "aviso-bloqueio-dia liberado"; avisoDia.textContent = "✅ Lançamentos liberados"; }
        else if (!semanaValida) { avisoDia.className = "aviso-bloqueio-dia bloqueado"; avisoDia.textContent = "🔒 Selecione a semana acima"; }
        else { avisoDia.className = "aviso-bloqueio-dia bloqueado"; avisoDia.textContent = "🔒 Preencha a data deste dia para liberar"; }
      }
      bloco.querySelectorAll("tbody input").forEach(inp => { inp.disabled = !liberado; });
    });
  }

  function recalcular() {
    document.querySelectorAll('input[data-formula]').forEach(inpTotal => {
      const ids = inpTotal.dataset.formula.split(",");
      let soma = 0;
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) { const v = parseInt(String(el.value).replace(/\D/g, ""), 10); if (!isNaN(v)) soma += v; }
      });
      inpTotal.value = formatarInteiro2Digitos(soma);
      if (soma === 0) inpTotal.classList.add("vazio-visual"); else inpTotal.classList.remove("vazio-visual");
    });
    document.querySelectorAll('[data-totaldia]').forEach(span => {
      const [idSemana, dIdx] = span.dataset.totaldia.split("-");
      let somaDia = 0;
      for (let i = 0; i < linhas; i++) {
        [`r-${idSemana}-${dIdx}-${i}`, `c-${idSemana}-${dIdx}-${i}`, `tb-${idSemana}-${dIdx}-${i}`, `o-${idSemana}-${dIdx}-${i}`].forEach(id => {
          const el = document.getElementById(id);
          if (el) { const v = parseInt(String(el.value).replace(/\D/g, ""), 10); if (!isNaN(v)) somaDia += v; }
        });
      }
      span.textContent = formatarInteiro2Digitos(somaDia);
    });
  }

  function coletarQuarteiroesAgrupados() {
    const mapa = {};
    document.querySelectorAll("#semanas .semana").forEach(semana => {
      const idSemana = parseInt(semana.dataset.semana);
      const diasBlocos = semana.querySelectorAll(".dia");
      diasBlocos.forEach((blocoDia, dIdx) => {
        for (let i = 0; i < linhas; i++) {
          const qEl = document.getElementById(`q-${idSemana}-${dIdx}-${i}`);
          if (!qEl) continue;
          const quart = qEl.value.trim();
          if (!quart) continue;
          if (!mapa[quart]) mapa[quart] = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
          ["r", "c", "tb", "pe", "o"].forEach(letra => {
            const el = document.getElementById(`${letra}-${idSemana}-${dIdx}-${i}`);
            if (el) { const v = parseInt(String(el.value).replace(/\D/g, ""), 10); if (!isNaN(v)) mapa[quart][letra.toUpperCase()] += v; }
          });
        }
      });
    });
    return mapa;
  }

  // ==== Fonte única de dados detalhados (usada por "Total de imóveis" e "Informados") ====
  function coletarRegistrosDetalhados() {
    const registros = [];
    document.querySelectorAll("#semanas .semana").forEach(semana => {
      const idSemana = parseInt(semana.dataset.semana);
      const diasBlocos = semana.querySelectorAll(".dia");
      diasBlocos.forEach((blocoDia, dIdx) => {
        const dataInput = document.getElementById(`data-${idSemana}-${dIdx}`);
        const dataValor = dataInput && dataInput.value ? dataInput.value : "";
        for (let i = 0; i < linhas; i++) {
          const qEl = document.getElementById(`q-${idSemana}-${dIdx}-${i}`);
          if (!qEl) continue;
          const quart = qEl.value.trim();
          if (!quart) continue;
          const agEl = document.getElementById(`ag-${idSemana}-${dIdx}-${i}`);
          const agente = agEl ? agEl.value.trim() : "";
          const val = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
          ["r", "c", "tb", "pe", "o"].forEach(letra => {
            const el = document.getElementById(`${letra}-${idSemana}-${dIdx}-${i}`);
            if (el) { const v = parseInt(String(el.value).replace(/\D/g, ""), 10); if (!isNaN(v)) val[letra.toUpperCase()] = v; }
          });
          registros.push({ data: dataValor, agente, quart, ...val, total: val.R + val.C + val.TB + val.O });
        }
      });
    });
    return registros;
  }

      const divTabela = document.createElement("div");

  function atualizarTotalImoveis() {
    const container = document.getElementById("tabelaTotalImoveis");
    const contador = document.getElementById("contadorTotal");
    const filtroQ = (document.getElementById("filtroQuarteirao").value || "").toLowerCase().trim();
    const filtroA = (document.getElementById("filtroAgente").value || "").toLowerCase().trim();

    const registros = coletarRegistrosDetalhados();

    let filtrados = registros;
    if (filtroQ) filtrados = filtrados.filter(r => r.quart.toLowerCase().includes(filtroQ));
    if (filtroA) filtrados = filtrados.filter(r => r.agente.toLowerCase().includes(filtroA));
    filtrados.sort((a, b) => {
      if (a.data && b.data) { if (a.data !== b.data) return b.data.localeCompare(a.data); }
      else if (a.data) return -1;
      else if (b.data) return 1;
      return a.quart.localeCompare(b.quart, "pt-BR", { numeric: true });
    });
    container.innerHTML = "";
    if (filtrados.length === 0) {
      container.innerHTML = `<div class="info-vazia">Nenhum lançamento encontrado${filtroQ || filtroA ? " com esses filtros" : ""}.</div>`;
      contador.textContent = "";
      return;
    }
    const geral = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
    filtrados.forEach(r => { geral.R += r.R; geral.C += r.C; geral.TB += r.TB; geral.PE += r.PE; geral.O += r.O; });
    contador.textContent = `Total de ${filtrados.length} lançamento(s)`;
    const divTabela = document.createElement("div");
    divTabela.className = "tabela-total";
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");
    ["Data", "Agente", "Quarteirão", "R", "C", "TB", "PE", "O", "Total"].forEach(col => {
      const th = document.createElement("th");
      th.textContent = col;
      if (col === "Data") th.className = "col-data";
      else if (col === "Agente") th.className = "col-ag";
      else if (col === "Quarteirão") th.className = "col-quart";
      else if (col === "Total") th.className = "col-total";
      else th.className = "col-num";
      trHead.appendChild(th);
    });
    thead.appendChild(trHead); table.appendChild(thead);
    const tbody = document.createElement("tbody");
    filtrados.forEach(r => {
      const tr = document.createElement("tr");
      let dataFmt = "";
      if (r.data) { const [y, m, d] = r.data.split("-"); dataFmt = `${d}/${m}/${y}`; }
      tr.innerHTML = `
        <td class="col-data">${dataFmt}</td>
        <td class="col-ag">${r.agente}</td>
        <td class="col-quart">${formatarIdentificador2Digitos(r.quart)}</td>
        <td class="col-num">${formatarInteiro2Digitos(r.R)}</td>
        <td class="col-num">${formatarInteiro2Digitos(r.C)}</td>
        <td class="col-num">${formatarInteiro2Digitos(r.TB)}</td>
        <td class="col-num">${formatarInteiro2Digitos(r.PE)}</td>
        <td class="col-num">${formatarInteiro2Digitos(r.O)}</td>
        <td class="col-total"><b>${formatarInteiro2Digitos(r.total)}</b></td>
      `;
      tbody.appendChild(tr);
    });
    const totalGeral = geral.R + geral.C + geral.TB + geral.O;
    const trTotal = document.createElement("tr");
    trTotal.className = "linha-total";
    trTotal.innerHTML = `
      <td class="col-data" colspan="3">TOTAL</td>

      if (r.agente) {
        if (!mapaAgentes[r.quart]) mapaAgentes[r.quart] = new Set();
        mapaAgentes[r.quart].add(r.agente);
      }
      if (r.data) {
        if (!mapaDatas[r.quart]) {
          mapaDatas[r.quart] = { primeira: r.data, ultima: r.data };
        } else {
          if (r.data < mapaDatas[r.quart].primeira) mapaDatas[r.quart].primeira = r.data;
          if (r.data > mapaDatas[r.quart].ultima)   mapaDatas[r.quart].ultima   = r.data;
        }

    });

      if (!iso) return "-";

      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    container.innerHTML = "";

  function coletarResumosBoletins() {
    const resultado = {};
    const pQ = (dadosFormularios.boletins && dadosFormularios.boletins.porQuarteirao) || {};
    Object.keys(pQ).forEach(q => {
      const form = pQ[q];
      if (!form) return;
      const counts = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
      const numPag = form.paginas || 1;
      for (let p = 0; p < numPag; p++) {
        for (let t = 1; t <= 2; t++) {
          for (let i = 0; i < LINHAS_IMOVEIS_BOLETINS; i++) {
            const k = `${p}_${t}_${i}`;
            const l = form.imoveis && form.imoveis[k];
            if (!l) continue;
            const tipo = String(l.tipo || "").trim().toUpperCase();
            if (tipo && Object.prototype.hasOwnProperty.call(counts, tipo)) counts[tipo]++;
          }
        }
      }
      resultado[q] = {
        R: counts.R, C: counts.C, TB: counts.TB, PE: counts.PE, O: counts.O,
        total: counts.R + counts.C + counts.TB + counts.PE + counts.O
      };
    });
    return resultado;
  }

  function coletarBasesBoletins() {
    const resultado = {};
    const pQ = (dadosFormularios.boletins && dadosFormularios.boletins.porQuarteirao) || {};
    Object.keys(pQ).forEach(q => {
      const form = pQ[q];
      if (!form) return;
      const counts = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
      const numPag = form.paginas || 1;
      for (let p = 0; p < numPag; p++) {
        for (let t = 1; t <= 2; t++) {
          for (let i = 0; i < LINHAS_IMOVEIS_BOLETINS; i++) {
            const k = `${p}_${t}_${i}`;
            const l = form.imoveis && form.imoveis[k];
            if (!l) continue;
            const tipo = String(l.tipo || "").trim().toUpperCase();
            if (!tipo || !Object.prototype.hasOwnProperty.call(counts, tipo)) continue;
            const comp = String(l.comp || "").trim();
            if (comp !== "") continue;
            counts[tipo]++;
          }
        }
      }
      resultado[q] = {
        R: counts.R, C: counts.C, TB: counts.TB, PE: counts.PE, O: counts.O,
        total: counts.R + counts.C + counts.TB + counts.PE + counts.O
      };
    });
    return resultado;
  }

  function coletarResumosGerais() {
    const resultado = {};
    const resumosB = coletarResumosBoletins();
    Object.keys(resumosB).forEach(q => {
      const d = resumosB[q];
      resultado[q] = { R: d.R, C: d.C, TB: d.TB, PE: d.PE, O: d.O, total: d.total };
    });

    const reg = dadosFormularios.coflagrados || {};
    Object.keys(reg).forEach(k => {
      const l = reg[k] || {};
      const q = String(l.q || "").trim();
      if (!q) return;
      if (!resultado[q]) resultado[q] = { R: 0, C: 0, TB: 0, PE: 0, O: 0, total: 0 };
      resultado[q].R += parseInt(l.r, 10) || 0;
      resultado[q].C += parseInt(l.c, 10) || 0;
      resultado[q].TB += parseInt(l.tb, 10) || 0;
      resultado[q].PE += parseInt(l.pe, 10) || 0;
      resultado[q].O += parseInt(l.o, 10) || 0;
    });

    const setBoletins = new Set(Object.keys(resumosB));
    const regLegacy = dadosFormularios.resumo || {};
    const seenLegacy = new Set();
    Object.keys(regLegacy).forEach(rowKey => {
      const l = regLegacy[rowKey] || {};
      const q = String(l.q || "").trim();
      if (!q) return;
      if (setBoletins.has(q)) return;
      if (seenLegacy.has(q)) return;
      seenLegacy.add(q);
      if (!resultado[q]) resultado[q] = { R: 0, C: 0, TB: 0, PE: 0, O: 0, total: 0 };
      resultado[q].R += parseInt(l.r, 10) || 0;
      resultado[q].C += parseInt(l.c, 10) || 0;
      resultado[q].TB += parseInt(l.tb, 10) || 0;
      resultado[q].PE += parseInt(l.pe, 10) || 0;
      resultado[q].O += parseInt(l.o, 10) || 0;
    });

    Object.keys(resultado).forEach(q => {
      const d = resultado[q];
      d.total = d.R + d.C + d.TB + d.PE + d.O;
    });

    return resultado;
  }

    if (!container) return;
    container.innerHTML = "";

    const resumosBoletins = coletarResumosBoletins();
    const quarteiroesB = Object.keys(resumosBoletins).sort((a, b) => {
      if (a === "_legacy") return 1;
      if (b === "_legacy") return -1;
      return a.localeCompare(b, "pt-BR", { numeric: true });
    });

    const setQ = new Set(quarteiroesB);

    const legacy = [];
    const seen = new Set();
    const reg = dadosFormularios.resumo || {};
    Object.keys(reg).forEach(rowKey => {
      const l = reg[rowKey] || {};
      const q = String(l.q || "").trim();
      if (!q) return;
      if (setQ.has(q)) return;
      if (seen.has(q)) return;
      seen.add(q);
      legacy.push({
        q,
        R: parseInt(l.r, 10) || 0,
        C: parseInt(l.c, 10) || 0,
        TB: parseInt(l.tb, 10) || 0,
        PE: parseInt(l.pe, 10) || 0,
        O: parseInt(l.o, 10) || 0
      });
    });
    legacy.sort((a, b) => a.q.localeCompare(b.q, "pt-BR", { numeric: true }));

    const todasLinhas = [];
    quarteiroesB.forEach(q => {
      const d = resumosBoletins[q];
      todasLinhas.push({ q, tipo: "auto", R: d.R, C: d.C, TB: d.TB, PE: d.PE, O: d.O, total: d.total });
    });
    legacy.forEach(e => {
      todasLinhas.push({ q: e.q, tipo: "legacy", R: e.R, C: e.C, TB: e.TB, PE: e.PE, O: e.O });

  function garantirEstruturaBoletins() {
    if (!dadosFormularios.boletins) dadosFormularios.boletins = {};

    if (cabecalhos.boletins && !cabecalhos.boletins.porQuarteirao) {
      const hLegacy = cabecalhos.boletins;
      const novoH = { porQuarteirao: {} };
      const pageToQuart = {};

      Object.keys(hLegacy).forEach(pKey => {
        const pageH = hLegacy[pKey] || {};
        const qKey = String(pageH.quarteirao || "").trim() || "_legacy";
        pageToQuart[pKey] = qKey;
        if (!novoH.porQuarteirao[qKey]) {
          const { quarteirao, ...rest } = pageH;
          novoH.porQuarteirao[qKey] = rest;
        }
      });

      cabecalhos.boletins = novoH;

      if (rodapes.boletins && !rodapes.boletins.porQuarteirao) {
        const rLegacy = rodapes.boletins;
        const novoR = { porQuarteirao: {} };
        Object.keys(rLegacy).forEach(pKey => {
          const qKey = pageToQuart[pKey] || "_legacy";
          if (!novoR.porQuarteirao[qKey]) {
            novoR.porQuarteirao[qKey] = { ...(rLegacy[pKey] || {}) };
          }
        });
        rodapes.boletins = novoR;
      }
    }

    if (cabecalhos.boletins && !cabecalhos.boletins.porQuarteirao) cabecalhos.boletins = { porQuarteirao: {} };
    if (rodapes.boletins && !rodapes.boletins.porQuarteirao) rodapes.boletins = { porQuarteirao: {} };

    const b = dadosFormularios.boletins;
    if (!b.porQuarteirao) {
      const legacyImoveis = b.imoveis || {};
      const legacyResumo = b.resumo || {};
      const totalPaginasLegacy = (paginas && paginas.boletins) || 1;
      const temConteudo = Object.keys(legacyImoveis).some(k => {
        const l = legacyImoveis[k];
        return l && (l.rua || l.numero || l.comp || l.seq || l.tipo);
      });
      b.porQuarteirao = {};
      if (temConteudo) {
        for (let p = 0; p < totalPaginasLegacy; p++) {
          const qKey = "_legacy";
          if (!b.porQuarteirao[qKey]) b.porQuarteirao[qKey] = { paginas: 0, imoveis: {}, resumo: {} };
          const novaPageIdx = b.porQuarteirao[qKey].paginas;
          b.porQuarteirao[qKey].paginas++;
          for (let t = 1; t <= 2; t++) {
            for (let i = 0; i < LINHAS_IMOVEIS_BOLETINS; i++) {
              const oldKey = `${p}_${t}_${i}`;
              if (legacyImoveis[oldKey]) {
                b.porQuarteirao[qKey].imoveis[`${novaPageIdx}_${t}_${i}`] = legacyImoveis[oldKey];
              }
            }
          }
          if (legacyResumo[p]) b.porQuarteirao[qKey].resumo[novaPageIdx] = legacyResumo[p];
        }
      }
      delete b.imoveis;
      delete b.resumo;
    }
  }

  function sincronizarQuarteiroesInformados() {
    garantirEstruturaBoletins();
    const mapa = coletarQuarteiroesAgrupados();
    const porQuart = dadosFormularios.boletins.porQuarteirao;
    let criados = 0;
    let atualizados = 0;

    Object.keys(mapa).forEach(q => {
      const v = mapa[q];
      const totalImoveis = v.R + v.C + v.TB + v.PE + v.O;
      const paginasNecessarias = Math.max(1, Math.ceil(totalImoveis / 50));

      if (!porQuart[q]) {
        porQuart[q] = { paginas: paginasNecessarias, imoveis: {}, resumo: {} };
        criados++;
      } else {
        if ((porQuart[q].paginas || 1) < paginasNecessarias) {
          porQuart[q].paginas = paginasNecessarias;
          atualizados++;
        }
      }
    });

    if (criados > 0 || atualizados > 0) salvarFormularios();

    const avisoEl = document.getElementById("avisoSincronizacao");
    if (avisoEl) {
      if (criados > 0 || atualizados > 0) {
        avisoEl.textContent = `🔄 Sincronização: ${criados} formulário(s) criado(s), ${atualizados} atualizado(s)`;
      } else {
        avisoEl.textContent = "";
      }
    }
  }

  function sincronizarAgora() {
    const antes = JSON.stringify(dadosFormularios.boletins.porQuarteirao || {});
    sincronizarQuarteiroesInformados();
    const depois = JSON.stringify(dadosFormularios.boletins.porQuarteirao || {});
    renderizarFormularioBoletins();
    if (!document.getElementById("painel-resumo").classList.contains("oculto")) {
      renderizarResumoIntegrado();
    }
    if (!document.getElementById("painel-bases").classList.contains("oculto")) {
      renderizarBasesIntegrado();
    }
    if (!document.getElementById("painel-resumogeral").classList.contains("oculto")) {
      renderizarResumoGeral();
    }
    if (antes === depois) {
      mostrarAviso("✅ Todos os quarteirões já possuem formulário");
    } else {
      mostrarAviso("🔄 Formulários sincronizados com a aba Informados");
    }
  }

  function popularSelectQuarteiroes() {
    const sel = document.getElementById("selectQuarteiraoBoletins");
    if (!sel) return;
    const pQ = (dadosFormularios.boletins && dadosFormularios.boletins.porQuarteirao) || {};
    const chaves = Object.keys(pQ).sort((a, b) => {
      if (a === "_legacy") return 1;
      if (b === "_legacy") return -1;
      return a.localeCompare(b, "pt-BR", { numeric: true });
    });

    sel.innerHTML = `<option value="">-- Selecione um quarteirão --</option>`;
    chaves.forEach(q => {
      const opt = document.createElement("option");
      opt.value = q;
      opt.textContent = q === "_legacy" ? "Sem quarteirão (legado)" : `Quarteirão ${formatarIdentificador2Digitos(q)}`;
      sel.appendChild(opt);
    });

    if (quarteiraoBoletinsSelecionado && chaves.indexOf(quarteiraoBoletinsSelecionado) !== -1) {
      sel.value = quarteiraoBoletinsSelecionado;
      return;
    }

    let saved = null;
    try { saved = localStorage.getItem(STORAGE_SELECAO_BOLETINS); } catch (e) {}

    if (saved !== null) {
      if (saved && chaves.indexOf(saved) !== -1) {
        quarteiraoBoletinsSelecionado = saved;
        sel.value = saved;
      } else {
        quarteiraoBoletinsSelecionado = "";
        sel.value = "";
      }
    } else {
      if (chaves.length > 0) {
        const primeiro = chaves.find(q => q !== "_legacy") || chaves[0];
        quarteiraoBoletinsSelecionado = primeiro;
        sel.value = primeiro;
        try { localStorage.setItem(STORAGE_SELECAO_BOLETINS, primeiro); } catch (e) {}
      } else {
        quarteiraoBoletinsSelecionado = "";
        sel.value = "";
      }
    }
  }

  function selecionarQuarteiraoBoletins(qKey) {
    quarteiraoBoletinsSelecionado = String(qKey || "");
    try { localStorage.setItem(STORAGE_SELECAO_BOLETINS, quarteiraoBoletinsSelecionado); } catch (e) {}
    aplicarVisibilidadeQuarteirao();
  }

  function aplicarVisibilidadeQuarteirao() {
    const blocos = document.querySelectorAll("#tabelaBoletins .bloco-quarteirao");
    blocos.forEach(b => {
      if (quarteiraoBoletinsSelecionado && b.dataset.quarteirao === quarteiraoBoletinsSelecionado) {
        b.classList.remove("oculto-por-selecao");
      } else {
        b.classList.add("oculto-por-selecao");
      }
    });
  }

  function atualizarContadorBoletins() {
    const contadorEl = document.getElementById("contadorBoletins");
    if (!contadorEl) return;
    const pQ = (dadosFormularios.boletins && dadosFormularios.boletins.porQuarteirao) || {};
    const chaves = Object.keys(pQ);
    const numQuarteiroes = chaves.filter(k => k !== "_legacy").length;
    const temLegacy = pQ._legacy ? 1 : 0;

    let totalPaginas = 0;
    let totalPreenchidos = 0;
    chaves.forEach(q => {
      const form = pQ[q];
      totalPaginas += form.paginas || 1;
      Object.keys(form.imoveis || {}).forEach(k => {
        const l = form.imoveis[k];
        if (l && (l.rua || l.numero || l.comp || l.seq || l.tipo)) totalPreenchidos++;
      });
    });

    contadorEl.textContent = `${numQuarteiroes} quarteirão(ões)${temLegacy ? " + 1 legado" : ""} | ${totalPaginas} página(s) | ${totalPreenchidos} imóvel(is) preenchido(s)`;
  }

  function recalcularResumoBoletins(qKey, paginaIdx) {
    const form = dadosFormularios.boletins.porQuarteirao && dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form) return;

    let bloco;
    try { bloco = document.querySelector(`.bloco-quarteirao[data-quarteirao="${CSS.escape(qKey)}"]`); }
    catch (e) { bloco = Array.from(document.querySelectorAll(".bloco-quarteirao")).find(b => b.dataset.quarteirao === qKey); }
    if (!bloco) return;
    const paginaEl = bloco.querySelector(`.pagina-a4[data-pagina="${paginaIdx}"]`);
    if (!paginaEl) return;

    const counts = { R: 0, C: 0, TB: 0, PE: 0, O: 0 };
    paginaEl.querySelectorAll('input[data-boletins-imovel="1"][data-campo="tipo"]').forEach(inp => {
      const tipo = String(inp.value || "").trim().toUpperCase();
      if (tipo !== "" && Object.prototype.hasOwnProperty.call(counts, tipo)) counts[tipo]++;
    });

    const total = counts.R + counts.C + counts.TB + counts.PE + counts.O;
    if (!form.resumo) form.resumo = {};
    form.resumo[paginaIdx] = {
      residencia: String(counts.R).padStart(2, "0"),
      comercio:   String(counts.C).padStart(2, "0"),
      terreno:    String(counts.TB).padStart(2, "0"),
      ponto:      String(counts.PE).padStart(2, "0"),
      outros:     String(counts.O).padStart(2, "0"),
      total:      String(total).padStart(2, "0")
    };

    const map = { residencia: counts.R, comercio: counts.C, terreno: counts.TB, ponto: counts.PE, outros: counts.O, total: total };
    Object.keys(map).forEach(campo => {
      const inp = paginaEl.querySelector(`input[data-boletins-resumo="1"][data-campo="${campo}"]`);
      if (inp) inp.value = form.resumo[paginaIdx][campo];
    });
  }

  function atualizarTotaisQuarteirao(qKey) {
    const form = dadosFormularios.boletins.porQuarteirao && dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form) return;
    const totals = { R: 0, C: 0, TB: 0, PE: 0, O: 0, total: 0 };
    for (let p = 0; p < (form.paginas || 1); p++) {
      const r = (form.resumo && form.resumo[p]) || {};
      totals.R += parseInt(r.residencia || "0", 10) || 0;
      totals.C += parseInt(r.comercio || "0", 10) || 0;
      totals.TB += parseInt(r.terreno || "0", 10) || 0;
      totals.PE += parseInt(r.ponto || "0", 10) || 0;
      totals.O += parseInt(r.outros || "0", 10) || 0;
      totals.total += parseInt(r.total || "0", 10) || 0;
    }
    let el;
    try { el = document.querySelector(`.totais-quarteirao[data-quarteirao="${CSS.escape(qKey)}"]`); }
    catch (e) { el = Array.from(document.querySelectorAll(".totais-quarteirao")).find(e => e.dataset.quarteirao === qKey); }
    if (el) {
      el.innerHTML = `
        <b>Total do Quarteirão ${qKey === "_legacy" ? "(legado)" : qKey}:</b>
        R: ${String(totals.R).padStart(2, "0")} |
        C: ${String(totals.C).padStart(2, "0")} |
        TB: ${String(totals.TB).padStart(2, "0")} |
        PE: ${String(totals.PE).padStart(2, "0")} |
        O: ${String(totals.O).padStart(2, "0")} |
        <b>Total: ${String(totals.total).padStart(2, "0")}</b>
      `;
    }
  }

  function renderizarFormularioBoletins() {
    const container = document.getElementById("tabelaBoletins");
    if (!container) return;
    container.innerHTML = "";

    garantirEstruturaBoletins();
    sincronizarQuarteiroesInformados();

    const pQ = dadosFormularios.boletins.porQuarteirao || {};
    const quarteiroes = Object.keys(pQ).sort((a, b) => {
      if (a === "_legacy") return 1;
      if (b === "_legacy") return -1;
      return a.localeCompare(b, "pt-BR", { numeric: true });
    });

    if (quarteiroes.length === 0) {
      container.innerHTML = `<div class="info-vazia">Nenhum quarteirão encontrado na aba Informados.<br>Lance quarteirões no Diário para gerar os formulários automaticamente.</div>`;
      atualizarContadorBoletins();
      popularSelectQuarteiroes();
      return;
    }

    quarteiroes.forEach(q => {
      const form = pQ[q];
      if (!form) return;
      const numPaginas = form.paginas || 1;

      const divQuarteirao = document.createElement("div");
      divQuarteirao.className = "bloco-quarteirao";
      divQuarteirao.dataset.quarteirao = q;

      const tituloQ = document.createElement("div");
      tituloQ.className = "titulo-bloco-quarteirao" + (q === "_legacy" ? " legado" : "");
      const rotulo = q === "_legacy" ? "Sem quarteirão (legado)" : `Quarteirão ${formatarIdentificador2Digitos(q)}`;
      tituloQ.innerHTML = `${rotulo} <span class="badge-paginas">${numPaginas} página${numPaginas > 1 ? "s" : ""}</span>`;
      divQuarteirao.appendChild(tituloQ);

      const barraQ = document.createElement("div");
      barraQ.className = "barra-botoes-quarteirao";
      barraQ.innerHTML = `
        <button class="acao info" onclick="adicionarPaginaQuarteirao('${escapeAttr(q)}')">➕ Adicionar Página</button>
        ${numPaginas > 1 ? `<button class="acao perigo" onclick="removerPaginaQuarteirao('${escapeAttr(q)}')">🗑️ Remover Última Página</button>` : ""}
        <button class="acao sucesso" onclick="gerarPDFQuarteirao('${escapeAttr(q)}')">📄 PDF deste Quarteirão</button>
        <button class="acao" onclick="imprimirQuarteirao('${escapeAttr(q)}')">🖨️ Imprimir este Quarteirão</button>
      `;
      divQuarteirao.appendChild(barraQ);

      for (let p = 0; p < numPaginas; p++) {
        divQuarteirao.appendChild(criarPaginaBoletim(q, p, numPaginas));
      }

      container.appendChild(divQuarteirao);
    });

    vincularEventosCabecalhoRodapeBoletins();
    atualizarContadorBoletins();

    quarteiroes.forEach(q => {
      const form = pQ[q];
      if (!form) return;
      for (let p = 0; p < (form.paginas || 1); p++) recalcularResumoBoletins(q, p);
      atualizarTotaisQuarteirao(q);
    });

    popularSelectQuarteiroes();
    aplicarVisibilidadeQuarteirao();

    salvarFormularios();
  }

  function criarPaginaBoletim(qKey, paginaIdx, totalPaginas) {
    const divPagina = document.createElement("div");
    divPagina.className = "pagina-a4";
    divPagina.dataset.pagina = paginaIdx;

    const rotuloQ = qKey === "_legacy" ? "(sem quarteirão)" : formatarIdentificador2Digitos(qKey);

    divTitulo.className = "titulo-pagina";
    divTitulo.textContent = qKey === "_legacy"
      ? `Sem quarteirão (legado) — Página ${paginaIdx + 1} de ${totalPaginas}`
      : `Quarteirão ${rotuloQ} — Página ${paginaIdx + 1} de ${totalPaginas}`;
    divPagina.appendChild(divTitulo);

    const hTitulo = document.createElement("div");
    hTitulo.className = "titulo-principal";
    hTitulo.textContent = TITULO_PRINCIPAL;
    divPagina.appendChild(hTitulo);

    const hSub = document.createElement("div");
    hSub.className = "subtitulo";

    const legenda = document.createElement("div");

    legenda.innerHTML = `Códigos válidos na coluna <b>Tipo</b>: <b>R</b> = Residência · <b>C</b> = Comércio · <b>TB</b> = Terreno Baldio · <b>PE</b> = Ponto Estratégico · <b>O</b> = Outros`;
    divPagina.appendChild(legenda);

    const legendaCol = document.createElement("div");
    legendaCol.className = "legenda-colagem";
    legendaCol.innerHTML = `💡 <b>Dica:</b> copie várias células de uma planilha e cole (Ctrl+V) na primeira célula. Os valores serão distribuídos automaticamente.`;
    divPagina.appendChild(legendaCol);

    const divDupla = document.createElement("div");
    divDupla.className = "dupla-tabelas";

    const divT1 = document.createElement("div");
    divT1.className = "tabela-dupla";
    divT1.appendChild(criarTabelaImoveisBoletins(qKey, paginaIdx, 1));

    const divT2 = document.createElement("div");
    divT2.className = "tabela-dupla";
    divT2.appendChild(criarTabelaImoveisBoletins(qKey, paginaIdx, 2));

    divDupla.appendChild(divT1);
    divDupla.appendChild(divT2);
    divPagina.appendChild(divDupla);

    const hResumo = document.createElement("div");
    hResumo.className = "titulo-principal";
    hResumo.style.marginTop = "12px";
    hResumo.style.fontSize = "13px";
    hResumo.textContent = "Resumo";
    divPagina.appendChild(hResumo);

    const divResumo = document.createElement("div");
    divResumo.className = "dupla-tabelas";

    divResumo.appendChild(criarResumoBoletins(qKey, paginaIdx, [
      { id: "residencia", label: "Residência" },
      { id: "comercio",   label: "Comércio" },
      { id: "terreno",    label: "Terreno Baldio" }
    ]));
    divResumo.appendChild(criarResumoBoletins(qKey, paginaIdx, [
      { id: "ponto",   label: "Ponto Estratégico" },
      { id: "outros",  label: "Outros" },
      { id: "total",   label: "Total", total: true }
    ]));

    divPagina.appendChild(divResumo);
    divPagina.appendChild(criarRodapeBoletins(qKey));

    return divPagina;
  }

  function criarCabecalhoBoletins(qKey, paginaIdx) {
    const divCab = document.createElement("div");
    divCab.className = "cabecalho-tabelas";
    const dadosCab = (cabecalhos.boletins && cabecalhos.boletins.porQuarteirao && cabecalhos.boletins.porQuarteirao[qKey]) || {};

    CAMPOS_CABECALHO.forEach(campo => {
      const div = document.createElement("div");
      div.className = "campo";
      const label = document.createElement("label");
      label.textContent = campo.label + ":";
      div.appendChild(label);
      const inp = document.createElement("input");
      inp.type = "text";
      inp.dataset.campo = campo.id;
      inp.dataset.tipo = "boletins";
      inp.dataset.quarteirao = qKey;
      inp.value = dadosCab[campo.id] || "";
      inp.placeholder = "—";
      div.appendChild(inp);
      divCab.appendChild(div);
    });

    const divQ = document.createElement("div");
    divQ.className = "campo campo-quarteirao-fixo";
    const labelQ = document.createElement("label");
    labelQ.textContent = "Quarteirão:";
    divQ.appendChild(labelQ);
    const inpQ = document.createElement("input");
    inpQ.type = "text";
    inpQ.value = qKey === "_legacy" ? "(sem quarteirão)" : formatarIdentificador2Digitos(qKey);
    inpQ.readOnly = true;
    divQ.appendChild(inpQ);
    divCab.appendChild(divQ);

    return divCab;
  }

  function criarTabelaImoveisBoletins(qKey, paginaIdx, tabelaNum) {
    const table = document.createElement("table");
    table.className = "tabela-boletins-imoveis";

    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");
    [
      { label: "Rua / Logradouro", cls: "col-rua"    },
      { label: "Nº",               cls: "col-numero" },
      { label: "Complemento",      cls: "col-comp"   },
      { label: "Sequência",        cls: "col-seq"    },
      { label: "Tipo",             cls: "col-tipo"   }
    ].forEach(c => {
      const th = document.createElement("th");
      th.textContent = c.label;
      th.className = c.cls;
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const form = dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form.imoveis) form.imoveis = {};

    for (let i = 0; i < LINHAS_IMOVEIS_BOLETINS; i++) {
      const rowKey = `${paginaIdx}_${tabelaNum}_${i}`;
      const dadosLinha = form.imoveis[rowKey] || {};

      const tipoVal = String(dadosLinha.tipo || "");
      const tipoInvalido = tipoVal !== "" && !isTipoBoletimValido(tipoVal);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="col-rua"><input type="text" data-boletins-imovel="1" data-quarteirao="${escapeHtmlAttr(qKey)}" data-pagina="${paginaIdx}" data-key="${rowKey}" data-campo="rua" value="${escapeHtmlAttr(dadosLinha.rua || "")}" placeholder=""></td>
        <td class="col-numero"><input type="text" data-boletins-imovel="1" data-quarteirao="${escapeHtmlAttr(qKey)}" data-pagina="${paginaIdx}" data-key="${rowKey}" data-campo="numero" value="${escapeHtmlAttr(dadosLinha.numero || "")}" placeholder=""></td>
        <td class="col-comp"><input type="text" data-boletins-imovel="1" data-quarteirao="${escapeHtmlAttr(qKey)}" data-pagina="${paginaIdx}" data-key="${rowKey}" data-campo="comp" value="${escapeHtmlAttr(dadosLinha.comp || "")}" placeholder=""></td>
        <td class="col-seq"><input type="text" inputmode="numeric" data-boletins-imovel="1" data-quarteirao="${escapeHtmlAttr(qKey)}" data-pagina="${paginaIdx}" data-key="${rowKey}" data-campo="seq" value="${escapeHtmlAttr(formatarSeq2Digitos(dadosLinha.seq || ""))}" placeholder=""></td>
        <td class="col-tipo"><input type="text" maxlength="2" data-boletins-imovel="1" data-quarteirao="${escapeHtmlAttr(qKey)}" data-pagina="${paginaIdx}" data-key="${rowKey}" data-campo="tipo" value="${escapeHtmlAttr(tipoVal)}" placeholder="" class="${tipoInvalido ? 'invalido' : ''}"></td>
      `;
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    table.querySelectorAll("input").forEach(inp => {
      const campo = inp.dataset.campo;
      const q = inp.dataset.quarteirao;
      const pg = parseInt(inp.dataset.pagina, 10);

      if (campo === "tipo") {
        inp.addEventListener("input", () => {
          const posOriginal = inp.selectionStart;
          const normalizado = normalizarTipoBoletim(inp.value);
          if (inp.value !== normalizado) {
            inp.value = normalizado;
            try { inp.setSelectionRange(Math.min(posOriginal, normalizado.length), Math.min(posOriginal, normalizado.length)); } catch (e) {}
          }
          if (inp.value.trim() !== "" && !isTipoBoletimValido(inp.value)) inp.classList.add("invalido");
          else inp.classList.remove("invalido");

          const k = inp.dataset.key;
          const f = dadosFormularios.boletins.porQuarteirao[q];
          if (!f) return;
          if (!f.imoveis) f.imoveis = {};
          if (!f.imoveis[k]) f.imoveis[k] = {};
          f.imoveis[k][campo] = inp.value;

          recalcularResumoBoletins(q, pg);
          atualizarTotaisQuarteirao(q);

          salvarFormularios();
          salvarComAtraso();
          atualizarContadorBoletins();
        });
      } else {
        inp.addEventListener("input", () => {
          const k = inp.dataset.key;
          const f = dadosFormularios.boletins.porQuarteirao[q];
          if (!f) return;
          if (!f.imoveis) f.imoveis = {};
          if (!f.imoveis[k]) f.imoveis[k] = {};
          f.imoveis[k][campo] = inp.value;
          salvarFormularios();
          salvarComAtraso();
          atualizarContadorBoletins();
        });

        if (campo === "seq") {
          inp.addEventListener("focusout", () => {
            const raw = inp.value.trim();
            if (raw !== "") {
              const fmt = formatarSeq2Digitos(raw);
              if (fmt !== inp.value) {
                inp.value = fmt;
                const k = inp.dataset.key;
                const f = dadosFormularios.boletins.porQuarteirao[q];
                if (f && f.imoveis && f.imoveis[k]) {
                  f.imoveis[k].seq = fmt;
                  salvarFormularios();
                  salvarComAtraso();
                }
              }
            }
          });
        }
      }
    });

    return table;
  }

  function criarResumoBoletins(qKey, paginaIdx, campos) {
    const div = document.createElement("div");
    div.className = "tabela-dupla";

    const dadosResumo =
      (dadosFormularios.boletins &&
       dadosFormularios.boletins.porQuarteirao &&
       dadosFormularios.boletins.porQuarteirao[qKey] &&
       dadosFormularios.boletins.porQuarteirao[qKey].resumo &&
       dadosFormularios.boletins.porQuarteirao[qKey].resumo[paginaIdx]) || {};

    const table = document.createElement("table");
    table.className = "tabela-boletins-resumo";

    const thead = document.createElement("thead");
    thead.innerHTML = `<tr><th>Tipo</th><th class="col-qtd">Qtd</th></tr>`;
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    campos.forEach(c => {
      const tr = document.createElement("tr");
      if (c.total) tr.className = "linha-total";
      tr.innerHTML = `
        <td class="col-desc">${c.label}</td>
        <td class="col-qtd">
          <input type="text" readonly
                 data-boletins-resumo="1"
                 data-quarteirao="${escapeHtmlAttr(qKey)}"
                 data-pagina="${paginaIdx}"
                 data-campo="${c.id}"
                 value="${escapeHtmlAttr(dadosResumo[c.id] || "")}"
                 placeholder="">
        </td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    div.appendChild(table);
    return div;
  }

  function adicionarPaginaQuarteirao(qKey) {
    const form = dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form) return;
    form.paginas = (form.paginas || 1) + 1;
    salvarFormularios();
    salvarComAtraso();
    renderizarFormularioBoletins();
    mostrarAviso(`➕ Página adicionada ao quarteirão ${qKey === "_legacy" ? "(legado)" : qKey}`);
  }

  function removerPaginaQuarteirao(qKey) {
    const form = dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form) return;
    if ((form.paginas || 1) <= 1) return;
    if (!confirm(`Remover a última página do quarteirão ${qKey === "_legacy" ? "(legado)" : qKey}? Os dados dessa página serão PERDIDOS.`)) return;

    const ultimaPagina = form.paginas - 1;
    Object.keys(form.imoveis || {}).forEach(k => {
      if (k.startsWith(`${ultimaPagina}_`)) delete form.imoveis[k];
    });
    if (form.resumo) delete form.resumo[ultimaPagina];

    form.paginas = ultimaPagina;
    salvarFormularios();
    salvarComAtraso();
    renderizarFormularioBoletins();
    mostrarAviso(`🗑️ Página removida do quarteirão ${qKey === "_legacy" ? "(legado)" : qKey}`);
  }

  function vincularEventosCabecalhoRodapeBoletins() {
    document.querySelectorAll('#tabelaBoletins .cabecalho-tabelas input:not([readonly])').forEach(inp => {
      inp.oninput = () => {
        const q = inp.dataset.quarteirao;
        const campo = inp.dataset.campo;
        if (!cabecalhos.boletins) cabecalhos.boletins = { porQuarteirao: {} };
        if (!cabecalhos.boletins.porQuarteirao) cabecalhos.boletins.porQuarteirao = {};
        if (!cabecalhos.boletins.porQuarteirao[q]) cabecalhos.boletins.porQuarteirao[q] = {};
        cabecalhos.boletins.porQuarteirao[q][campo] = inp.value;

        salvarComAtraso();

    document.querySelectorAll('#tabelaBoletins .rodape-pagina input').forEach(inp => {

        if (!rodapes.boletins.porQuarteirao) rodapes.boletins.porQuarteirao = {};
        if (!rodapes.boletins.porQuarteirao[q]) rodapes.boletins.porQuarteirao[q] = {};
        rodapes.boletins.porQuarteirao[q][campo] = inp.value;
        salvarRodapes();
        salvarComAtraso();
      };
