  function tratarColagemBoletins(e) {
    const target = e.target;
    if (!(target instanceof HTMLInputElement)) return;
    if (target.dataset.boletinsImovel !== '1') return;

    const clipboardData = e.clipboardData || window.clipboardData;
    if (!clipboardData) return;

    const texto = clipboardData.getData('text/plain');
    if (!texto) return;

    const temTab = texto.indexOf('\t') !== -1;
    const temNovaLinha = texto.indexOf('\n') !== -1 || texto.indexOf('\r') !== -1;
    if (!temTab && !temNovaLinha) return;

    e.preventDefault();

    let textoNorm = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (textoNorm.endsWith('\n')) textoNorm = textoNorm.slice(0, -1);
    const linhasTexto = textoNorm.split('\n');
    if (linhasTexto.length === 0) return;
    const matriz = linhasTexto.map(l => l.split('\t'));
    if (matriz.length === 0) return;

    const qKey = target.dataset.quarteirao;
    const paginaInicial = parseInt(target.dataset.pagina, 10);
    const keyParts = (target.dataset.key || '').split('_');
    if (keyParts.length !== 3) return;
    const tabelaInicial = parseInt(keyParts[1], 10);
    const linhaInicial = parseInt(keyParts[2], 10);

    const campoInicial = target.dataset.campo;
    const colunasOrdem = ['rua', 'numero', 'comp', 'seq', 'tipo'];
    const colInicial = colunasOrdem.indexOf(campoInicial);
    if (colInicial === -1) return;

    const form = dadosFormularios.boletins &&
                 dadosFormularios.boletins.porQuarteirao &&
                 dadosFormularios.boletins.porQuarteirao[qKey];
    if (!form) return;
    if (!form.imoveis) form.imoveis = {};
    if (!form.resumo) form.resumo = {};

    const paginasAtuais = form.paginas || 1;
    const linearInicial = 50 * paginaInicial + (tabelaInicial - 1) * 25 + linhaInicial;
    const linearFinal = linearInicial + matriz.length - 1;
    const paginaFinal = Math.floor(linearFinal / 50);
    const paginasNecessarias = Math.max(paginaFinal + 1, paginasAtuais);
    const paginasACriar = paginasNecessarias - paginasAtuais;

    if (paginasACriar > 100) {
      alert(`A colagem criaria ${paginasACriar} página(s) nova(s) neste quarteirão (limite: 100 de uma vez). Reduza a seleção e tente novamente.`);
      return;
    }

    let linhasPreenchidas = 0;
    let celulasPreenchidas = 0;

    for (let r = 0; r < matriz.length; r++) {
      const linhaDados = matriz[r];
      const linearLinha = linearInicial + r;
      const pagina = Math.floor(linearLinha / 50);
      const indexNaPagina = linearLinha % 50;
      const tabelaNum = Math.floor(indexNaPagina / 25) + 1;
      const linhaNaTabela = indexNaPagina % 25;

      const rowKey = `${pagina}_${tabelaNum}_${linhaNaTabela}`;
      if (!form.imoveis[rowKey]) form.imoveis[rowKey] = {};

      let linhaTemDados = false;
      for (let c = 0; c < linhaDados.length; c++) {
        const colFinal = colInicial + c;
        if (colFinal >= colunasOrdem.length) continue;

        const campo = colunasOrdem[colFinal];
        let valor = linhaDados[c];
        if (valor === undefined || valor === null) valor = '';
        valor = String(valor);

        if (valor.trim() === '') continue;

        if (campo === 'tipo') {
          valor = valor.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
          if (valor === '') continue;
        }

        form.imoveis[rowKey][campo] = valor;
        celulasPreenchidas++;
        linhaTemDados = true;
      }

      if (linhaTemDados) linhasPreenchidas++;
    }

    if (celulasPreenchidas === 0) {
      mostrarAviso("⚠️ Nada foi colado (células vazias ou fora do alcance)");
      return;
    }

    if (paginasACriar > 0) {
      form.paginas = paginasNecessarias;
    }

    salvarFormularios();
    salvarComAtraso();

    const scrollY = window.scrollY;
    renderizarFormularioBoletins();
    window.scrollTo(0, scrollY);

    let msg = `✅ Colado: ${linhasPreenchidas} linha(s), ${celulasPreenchidas} célula(s)`;
    if (paginasACriar > 0) msg += ` • ${paginasACriar} nova(s) página(s)`;
    mostrarAviso(msg);
  }

  function tratarColagemCoflagrados(e) {
    const target = e.target;
    if (!(target instanceof HTMLInputElement)) return;
    if (target.dataset.tipo !== 'coflagrados') return;

    const campoInicial = target.dataset.campo;
    const colunasOrdem = ['q', 'r', 'c', 'tb', 'pe', 'o'];
    const colInicial = colunasOrdem.indexOf(campoInicial);
    if (colInicial === -1) return;

    const clipboardData = e.clipboardData || window.clipboardData;
    if (!clipboardData) return;

    const texto = clipboardData.getData('text/plain');
    if (!texto) return;

    const temTab = texto.indexOf('\t') !== -1;
    const temNovaLinha = texto.indexOf('\n') !== -1 || texto.indexOf('\r') !== -1;
    if (!temTab && !temNovaLinha) return;

    e.preventDefault();

    let textoNorm = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (textoNorm.endsWith('\n')) textoNorm = textoNorm.slice(0, -1);
    const linhasTexto = textoNorm.split('\n');
    if (linhasTexto.length === 0) return;
    const matriz = linhasTexto.map(l => l.split('\t'));
    if (matriz.length === 0) return;

    const keyParts = (target.dataset.key || '').split('_');
    if (keyParts.length !== 3) return;
    const paginaInicial = parseInt(keyParts[0], 10);
    const tabelaInicial = parseInt(keyParts[1], 10);
    const linhaInicial = parseInt(keyParts[2], 10);

    const REGISTROS_POR_PAGINA = LINHAS_DUPLA * 2;
    const linearInicial = paginaInicial * REGISTROS_POR_PAGINA + (tabelaInicial - 1) * LINHAS_DUPLA + linhaInicial;
    const linearFinal = linearInicial + matriz.length - 1;
    const paginaFinal = Math.floor(linearFinal / REGISTROS_POR_PAGINA);
    const paginasNecessarias = paginaFinal + 1;
    const paginasAtuais = paginas.coflagrados || 1;
    const paginasACriar = Math.max(0, paginasNecessarias - paginasAtuais);

    if (paginasACriar > 100) {
      alert(`A colagem criaria ${paginasACriar} página(s) nova(s) (limite: 100 de uma vez). Reduza a seleção.`);
      return;
    }

    if (!dadosFormularios.coflagrados || typeof dadosFormularios.coflagrados !== "object") {
      dadosFormularios.coflagrados = {};
    }

    let linhasPreenchidas = 0;
    let celulasPreenchidas = 0;

    for (let r = 0; r < matriz.length; r++) {
      const linhaDados = matriz[r];
      const linearLinha = linearInicial + r;
      const pagina = Math.floor(linearLinha / REGISTROS_POR_PAGINA);
      const indexNaPagina = linearLinha % REGISTROS_POR_PAGINA;
      const tabelaNum = Math.floor(indexNaPagina / LINHAS_DUPLA) + 1;
      const linhaNaTabela = indexNaPagina % LINHAS_DUPLA;

      const rowKey = `${pagina}_${tabelaNum}_${linhaNaTabela}`;
      if (!dadosFormularios.coflagrados[rowKey]) dadosFormularios.coflagrados[rowKey] = {};

      let linhaTemDados = false;
      for (let c = 0; c < linhaDados.length; c++) {
        const colFinal = colInicial + c;
        if (colFinal >= colunasOrdem.length) continue;

        const campo = colunasOrdem[colFinal];
        let valor = linhaDados[c];
        if (valor === undefined || valor === null) valor = '';
        valor = String(valor);

        if (valor.trim() === '') continue;

        if (campo !== 'q') {
          valor = valor.replace(/[^\d]/g, '');
          if (valor === '') continue;
        }

        dadosFormularios.coflagrados[rowKey][campo] = valor;
        celulasPreenchidas++;
        linhaTemDados = true;
      }

      if (linhaTemDados) linhasPreenchidas++;
    }

    if (celulasPreenchidas === 0) {
      mostrarAviso("⚠️ Nada foi colado (células vazias ou fora do alcance)");
      return;
    }

    if (paginasACriar > 0) {
      paginas.coflagrados = paginasNecessarias;
      salvarPaginas();
    }

    salvarFormularios();
    salvarComAtraso();

    const scrollY = window.scrollY;
    renderizarCoflagrados();
    window.scrollTo(0, scrollY);

    let msg = `✅ Colado: ${linhasPreenchidas} linha(s), ${celulasPreenchidas} célula(s)`;
    if (paginasACriar > 0) msg += ` · ${paginasACriar} nova(s) página(s)`;
    mostrarAviso(msg);
  }

  function imprimirQuarteirao(qKey) {
    const blocos = document.querySelectorAll("#tabelaBoletins .bloco-quarteirao");
    const escondidos = [];
    let alvo = null;

    blocos.forEach(b => {
      if (b.dataset.quarteirao !== qKey) {
        escondidos.push({ el: b, display: b.style.display });
        b.style.display = "none";
      } else {

      }

    const paineis = document.querySelectorAll(".painel");
    const paineisEscondidos = [];
    paineis.forEach(p => {

        paineisEscondidos.push({ el: p, display: p.style.display });
        p.style.display = "none";
      }
    });

    document.body.classList.add("print-individual");

    setTimeout(() => {
      window.print();
      setTimeout(() => {
        escondidos.forEach(x => { x.el.style.display = x.display; });

    });
    thead.appendChild(trHead); table.appendChild(thead);
    const tbody = document.createElement("tbody");

    for (let i = 0; i < LINHAS_DUPLA; i++) {
      const tr = document.createElement("tr");

      const peVal = dadosLinha.pe || "";
      const oVal = dadosLinha.o || "";

      const cNum = parseInt(cVal, 10) || 0;
      const tbNum = parseInt(tbVal, 10) || 0;
      const peNum = parseInt(peVal, 10) || 0;
      const oNum = parseInt(oVal, 10) || 0;
      const totalLinha = rNum + cNum + tbNum + oNum;
      if (qVal.trim() !== "") contagem++;
      geral.R += rNum; geral.C += cNum; geral.TB += tbNum; geral.PE += peNum; geral.O += oNum;
      tr.innerHTML = `
        <td class="col-num-linha">${numeroLinha}</td>
        <td class="col-q"><input type="text" data-tipo="${tipo}" data-key="${rowKey}" data-campo="q" value="${escapeAttr(qVal)}" placeholder=""></td>

        <td class="col-n"><input type="text" class="num" data-tipo="${tipo}" data-key="${rowKey}" data-campo="c" value="${cVal}" placeholder=""></td>

    const totalGeral = geral.R + geral.C + geral.TB + geral.O;
    const trTotal = document.createElement("tr");
    trTotal.className = "linha-total";
    trTotal.innerHTML = `
      <td class="col-num-linha"></td>
      <td class="col-q">TOTAL</td>
      <td class="col-n">${formatarInteiro2Digitos(geral.R)}</td>
      <td class="col-n">${formatarInteiro2Digitos(geral.C)}</td>
      <td class="col-n">${formatarInteiro2Digitos(geral.TB)}</td>
      <td class="col-n">${formatarInteiro2Digitos(geral.PE)}</td>
      <td class="col-n">${formatarInteiro2Digitos(geral.O)}</td>
      <td class="col-t">${formatarInteiro2Digitos(totalGeral)}</td>
    `;
    tbody.appendChild(trTotal);
    table.appendChild(tbody);
    table.dataset.contagem = contagem;
    table.querySelectorAll("input.num").forEach(inp => {
      if (inp.value === "" || inp.value === undefined) {
        inp.value = "00"; inp.dataset.realVazio = "1"; inp.classList.add("vazio-visual");
      } else {
        const n = parseInt(String(inp.value).replace(/\D/g, ""), 10);
        if (!isNaN(n)) {
          inp.value = String(n).padStart(2, "0");
          if (n===0 && inp.dataset.realVazio==="1") {} else { delete inp.dataset.realVazio; }
          if (n===0 && inp.value==="00" && !inp.dataset.realVazio) { inp.classList.remove("vazio-visual"); }
        }
      }
    });
    table.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("input", () => {
        const t = inp.dataset.tipo;
        const k = inp.dataset.key;
        const c = inp.dataset.campo;
        if (!dadosFormularios[t]) dadosFormularios[t] = {};
        if (!dadosFormularios[t][k]) dadosFormularios[t][k] = {};
        dadosFormularios[t][k][c] = inp.value;
        salvarFormularios();
        salvarComAtraso();
      });
    });
    return table;
  }

  function coletarDados() {
    const semanas = [];
    document.querySelectorAll("#semanas .semana").forEach(semana => {
      const idSemana = parseInt(semana.dataset.semana);
      const selSem = semana.querySelector(".select-semana");
      const titulo = selSem ? selSem.value : "";
      const datas = [];
      const valores = {};
      semana.querySelectorAll(".dia").forEach((blocoDia, dIdx) => {
        const dataInput = blocoDia.querySelector('input[type="date"]');
        datas.push(dataInput ? dataInput.value : "");
        blocoDia.querySelectorAll("input").forEach(inp => {
          if (inp.id && inp.type !== "date") {
            if (inp.classList.contains("num")) {
              if (inp.dataset.realVazio === "1" && inp.value === "00") { valores[inp.id] = ""; }
              else {
                const raw = inp.value.trim();
                if (raw === "00") { valores[inp.id] = inp.dataset.realVazio === "1" ? "" : "0"; }
                else {
                  valores[inp.id] = raw.replace(/^0+(?=\d)/, "") || "0";
                  if (valores[inp.id] === "") valores[inp.id] = "";
                }
              }
            } else { valores[inp.id] = inp.value; }
          }
        });
      });
      semanas.push({ id: idSemana, titulo, datas, valores });
    });
    return semanas;
  }

  function salvar() {
    try {
      const semanas = coletarDados();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(semanas));
      if (nuvemAtiva && dbRef) {
        const agora = Date.now();
        ultimoTimestampLocal = agora;
        const payload = {
          timestamp: agora, semanas: semanas, statusQuarteiroes: statusQuarteiroes,
          paginas: paginas, cabecalhos: cabecalhos, rodapes: rodapes, dadosFormularios: dadosFormularios
        };
        dbRef.set(payload)
          .then(() => mostrarAviso("☁️ Salvo e sincronizado na nuvem!"))
          .catch(err => { console.error(err); mostrarAviso("💾 Salvo localmente (offline)"); });
      } else { mostrarAviso("💾 Salvo automaticamente"); }
    } catch (e) { mostrarAviso("⚠️ Erro ao salvar"); }
  }

  function salvarComAtraso() {
    clearTimeout(timeoutSalvar);
    timeoutSalvar = setTimeout(() => {
      salvar();
      if (!document.getElementById("painel-semanal").classList.contains("oculto")) atualizarResumoSemanal();
      if (!document.getElementById("painel-total").classList.contains("oculto")) atualizarTotalImoveis();
      if (!document.getElementById("painel-informados").classList.contains("oculto")) atualizarInformados();
      if (!document.getElementById("painel-andamento").classList.contains("oculto")) atualizarAndamento();
      if (!document.getElementById("painel-concluidos").classList.contains("oculto")) atualizarConcluidos();
      if (!document.getElementById("painel-resumo").classList.contains("oculto")) renderizarResumoIntegrado();
      if (!document.getElementById("painel-bases").classList.contains("oculto")) renderizarBasesIntegrado();
      if (!document.getElementById("painel-resumogeral").classList.contains("oculto")) renderizarResumoGeral();

  function carregar() {
    try {
      const dados = localStorage.getItem(STORAGE_KEY);
      if (!dados) return false;
      const semanas = JSON.parse(dados);
      if (!Array.isArray(semanas) || semanas.length === 0) return false;
      semanas.forEach(s => criarSemana(s));

  function escapeAttr(s) {
    return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
  }
  function escapeHtmlAttr(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function imprimir() { window.print(); }

  function sincronizarInputsNoClone(origem, clone) {
    const origInputs = origem.querySelectorAll("input, select, textarea");
    const cloneInputs = clone.querySelectorAll("input, select, textarea");
    for (let i = 0; i < origInputs.length; i++) {
      const o = origInputs[i];
      const c = cloneInputs[i];
      if (o && c) {
        if (o.tagName === "SELECT") {
          c.value = o.value;
        } else if (o.tagName === "TEXTAREA") {
          c.value = o.value;
          c.textContent = o.value;
        } else {
          c.value = o.value;
          c.setAttribute("value", o.value);
        }
      }
    }
  }

  async function exportarParaPDF(origemEl, nomeArquivo, orientacao = "portrait") {
    if (!origemEl || (!origemEl.children.length && !origemEl.innerHTML.trim())) {
      alert("Não há dados para gerar o PDF.");
      return;
    }
    if (typeof html2pdf === "undefined") {
      alert("Biblioteca de PDF não disponível. Usando a opção de impressão...");
      window.print();
      return;
    }

    mostrarAviso("⏳ Gerando e baixando PDF completo...");

    // Cria o wrapper isolado na resolução exata da folha A4
    const wrapper = document.createElement("div");
    wrapper.className = "pdf-export-wrapper " + orientacao;

    // Clona o elemento de forma profunda
    const clone = origemEl.cloneNode(true);

    // Sincroniza todos os valores digitados em inputs, selects e textareas
    sincronizarInputsNoClone(origemEl, clone);

    // Garante que todos os blocos de quarteirões fiquem visíveis no PDF completo
    clone.querySelectorAll(".bloco-quarteirao").forEach(b => b.classList.remove("oculto-por-selecao"));

    // Remove botões de ação e elementos interativos da folha de PDF
    clone.querySelectorAll(".btn-status-mini, .barra-botoes-quarteirao, .titulo-bloco-quarteirao, .barra-botoes-tabelas, .barra-filtro, .aviso-sincronizacao, .barra-selecao-quarteirao, .legenda-codigos, .legenda-colagem").forEach(el => el.remove());

    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    // Configuração com margens e viewport dimensionados para preenchimento total e sem corte lateral
    const opt = {
      margin: orientacao === "landscape" ? [6, 8, 6, 8] : [7, 8, 7, 8],
      filename: nomeArquivo,
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        logging: false,
        scrollX: 0,
        scrollY: 0,
        windowWidth: orientacao === "landscape" ? 1120 : 800
      },
      jsPDF: {
        unit: "mm",
        format: "a4",
        orientation: orientacao
      },
      pagebreak: { mode: ["css", "legacy"] }
    };

    try {
      await html2pdf().set(opt).from(wrapper).save();
      mostrarAviso("✅ PDF gerado e baixado com sucesso!");
    } catch (err) {
      console.error("Erro ao gerar PDF:", err);
      alert("Houve um problema ao gerar o PDF diretamente. Você pode tentar pela impressão.");
    } finally {
      if (wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
    }
  }

  async function gerarPDF(tipo) {
    const idMapa = {
      andamento: "tabelaAndamento",
      concluidos: "tabelaConcluidos",
      boletins: "tabelaBoletins",

  function exportarBackupJSON() {

      paginas: paginas, cabecalhos: cabecalhos, rodapes: rodapes, dadosFormularios: dadosFormularios

  function dispararImportacaoJSON() { document.getElementById("inputBackupJSON").click(); }

  function importarBackupJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const dados = JSON.parse(e.target.result);
        if (!dados || (!dados.semanas && !Array.isArray(dados))) throw new Error("Arquivo não reconhecido como backup válido.");
        if (!confirm("⚠️ Atenção: A restauração do backup substituirá os dados atuais. Deseja continuar?")) { event.target.value = ""; return; }
        const semanas = dados.semanas || dados;
        statusQuarteiroes = dados.statusQuarteiroes || {};
        paginas = Object.assign({ andamento: 1, concluidos: 1, boletins: 1, resumo: 1, bases: 1, coflagrados: 1, resumogeral: 1 }, dados.paginas);
        cabecalhos = Object.assign({ andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} }, dados.cabecalhos);
        rodapes = Object.assign({ andamento: {}, concluidos: {}, boletins: {}, resumo: {}, bases: {}, coflagrados: {}, resumogeral: {} }, dados.rodapes);
        dadosFormularios = Object.assign({ boletins: { porQuarteirao: {} }, resumo: {}, bases: {}, coflagrados: {} }, dados.dadosFormularios);
        if (!dadosFormularios.boletins) dadosFormularios.boletins = { porQuarteirao: {} };
        if (!dadosFormularios.coflagrados) dadosFormularios.coflagrados = {};

        garantirEstruturaBoletins();

        localStorage.setItem(STORAGE_KEY, JSON.stringify(semanas));
        salvarStatus(); salvarPaginas(); salvarCabecalhos(); salvarRodapes(); salvarFormularios();

        document.getElementById("semanas").innerHTML = "";
        semanaCount = 0;
        semanas.forEach(s => criarSemana(s));

        recalcular(); atualizarResumoSemanal(); atualizarTotalImoveis(); atualizarInformados();
        atualizarAndamento(); atualizarConcluidos(); renderizarFormularioBoletins();
        renderizarResumoIntegrado();
        renderizarBasesIntegrado();
        renderizarCoflagrados();
        renderizarResumoGeral();

        salvar();
        mostrarAviso("✅ Backup restaurado e sincronizado!");
      } catch (err) {
        console.error(err);
        alert("Erro ao restaurar arquivo: certifique-se de que é um arquivo JSON válido do Diário.");
      } finally { event.target.value = ""; }
    };
    reader.readAsText(file);
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.classList && e.target.classList.contains("num")) {
      const teclasPermitidas = ["Backspace","Delete","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Tab","Enter","Home","End"];
      if (teclasPermitidas.includes(e.key) || e.ctrlKey || e.metaKey) return;
      if (!/^\d$/.test(e.key)) e.preventDefault();
    }
  });

  document.addEventListener("focusin", (e) => {
    if (e.target.classList && e.target.classList.contains("num")) {
      const val = e.target.value.trim();
      if (e.target.dataset.realVazio === "1" && val === "00") {
        e.target.value = "";
        e.target.classList.remove("vazio-visual");
        return;
      }
      if (/^0\d+$/.test(val)) {
        e.target.value = String(parseInt(val, 10));
        try { e.target.setSelectionRange(e.target.value.length, e.target.value.length); } catch (err) {}
        return;
      }
      if (val !== "" && val !== "00") {
        setTimeout(() => { try { e.target.select(); } catch (err) {} }, 0);
      }
    }
  });

  document.addEventListener("focusout", (e) => {
    if (e.target.classList && e.target.classList.contains("num")) {
      const raw = e.target.value.trim().replace(/\D/g, "");
      if (raw === "") { e.target.value = "00"; e.target.dataset.realVazio = "1"; e.target.classList.add("vazio-visual"); }
      else {
        const n = parseInt(raw, 10);
        if (!isNaN(n)) {
          e.target.value = String(n).padStart(2, "0");
          delete e.target.dataset.realVazio; e.target.classList.remove("vazio-visual");
          if (n === 0) e.target.dataset.usuarioDigitou = "1"; else delete e.target.dataset.usuarioDigitou;
        } else { e.target.value = "00"; e.target.dataset.realVazio = "1"; e.target.classList.add("vazio-visual"); }
      }
      recalcular();
      salvarComAtraso();
    } else if (e.target.id && e.target.id.startsWith("q-")) {
      const raw = e.target.value.trim();
      if (/^\d+$/.test(raw)) {
        const formatado = raw.padStart(2, "0");
        if (e.target.value !== formatado) {
          e.target.value = formatado;
          recalcular();
          salvarComAtraso();
        }
      }
    } else if (e.target.dataset && e.target.dataset.campo === "q") {
      const raw = e.target.value.trim();
      if (/^\d+$/.test(raw)) {
        const formatado = raw.padStart(2, "0");
        if (e.target.value !== formatado) {
          e.target.value = formatado;
          const t = e.target.dataset.tipo;
          const k = e.target.dataset.key;
          if (dadosFormularios[t] && dadosFormularios[t][k]) {
            dadosFormularios[t][k].q = formatado;
            salvarFormularios();
            salvarComAtraso();
          }
        }
      }
    }
  });

  document.addEventListener("input", (e) => {
    if (e.target.classList && e.target.classList.contains("num")) {
      const valorLimpo = e.target.value.replace(/\D/g, "");
      if (e.target.value !== valorLimpo) e.target.value = valorLimpo;
      if (e.target.value !== "" && e.target.value !== "00") {
        delete e.target.dataset.realVazio; e.target.classList.remove("vazio-visual");
      }
      if (e.target.value !== "") e.target.dataset.usuarioDigitou = "1";
      recalcular();
      salvarComAtraso();
    } else if (e.target.type === "date" || e.target.id?.startsWith("ag-") || e.target.id?.startsWith("q-")) {
      salvarComAtraso();
    }
  });

      lista.forEach((q, idx) => {

        .sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));

      lista.forEach((q, idx) => {

      });
    }

    csv += "\n\n=== BOLETINS DE RECONHECIMENTO (por quarteirão) ===\n\n";
    {
      const pQ = (dadosFormularios.boletins && dadosFormularios.boletins.porQuarteirao) || {};
      const chaves = Object.keys(pQ).sort((a, b) => {
        if (a === "_legacy") return 1;
        if (b === "_legacy") return -1;
        return a.localeCompare(b, "pt-BR", { numeric: true });
      });
      chaves.forEach(q => {
        const form = pQ[q];
        const numPag = form.paginas || 1;
        csv += `\n--- Quarteirão ${q === "_legacy" ? "(legado)" : q} (${numPag} página${numPag > 1 ? "s" : ""}) ---\n`;
        for (let p = 0; p < numPag; p++) {
          csv += `"Página ${p + 1}"\n`;
          csv += "Rua / Logradouro,Nº,Complemento,Sequência,Tipo\n";
          for (let t = 1; t <= 2; t++) {
            for (let i = 0; i < LINHAS_IMOVEIS_BOLETINS; i++) {

            }
          }
          const r = (form.resumo && form.resumo[p]) || {};
          csv += `\n"Resumo da página ${p + 1}"\n`;

          csv += `"Comércio (C)","${r.comercio||""}"\n`;
          csv += `"Terreno Baldio (TB)","${r.terreno||""}"\n`;
          csv += `"Ponto Estratégico (PE)","${r.ponto||""}"\n`;
          csv += `"Outros (O)","${r.outros||""}"\n`;
          csv += `"Total","${r.total||""}"\n\n`;
        }
      });
    }

    csv += "\n\n=== RESUMO DE RECONHECIMENTO (auto dos Boletins - todos os imóveis) ===\n\n";
    {
      const resumos = coletarResumosBoletins();
      const chaves = Object.keys(resumos).sort((a, b) => {
        if (a === "_legacy") return 1;
        if (b === "_legacy") return -1;
        return a.localeCompare(b, "pt-BR", { numeric: true });
      });
      csv += "Quarteirão,R,C,TB,PE,O,Total\n";
      const g = { R:0,C:0,TB:0,PE:0,O:0,Total:0 };
      chaves.forEach(q => {
        const d = resumos[q];
        g.R+=d.R; g.C+=d.C; g.TB+=d.TB; g.PE+=d.PE; g.O+=d.O; g.Total+=d.total;
        csv += `"${q === "_legacy" ? "(legado)" : q}",${d.R},${d.C},${d.TB},${d.PE},${d.O},${d.total}\n`;
      });
      csv += `"TOTAL",${g.R},${g.C},${g.TB},${g.PE},${g.O},${g.Total}\n`;
    }

    csv += "\n\n=== BASES (auto dos Boletins - somente sem complemento) ===\n\n";
    {
      const bases = coletarBasesBoletins();
      const chaves = Object.keys(bases).sort((a, b) => {
        if (a === "_legacy") return 1;
        if (b === "_legacy") return -1;
        return a.localeCompare(b, "pt-BR", { numeric: true });
      });
      csv += "Quarteirão,R,C,TB,PE,O,Total\n";
      const g = { R:0,C:0,TB:0,PE:0,O:0,Total:0 };
      chaves.forEach(q => {
        const d = bases[q];
        g.R+=d.R; g.C+=d.C; g.TB+=d.TB; g.PE+=d.PE; g.O+=d.O; g.Total+=d.total;
        csv += `"${q === "_legacy" ? "(legado)" : q}",${d.R},${d.C},${d.TB},${d.PE},${d.O},${d.total}\n`;
      });
      csv += `"TOTAL",${g.R},${g.C},${g.TB},${g.PE},${g.O},${g.Total}\n`;
    }

    csv += "\n\n=== RESUMO GERAL (Boletins + Coflagrados) ===\n\n";
    {
      const gerais = coletarResumosGerais();
      const chaves = Object.keys(gerais).sort((a, b) => {
        if (a === "_legacy") return 1;
        if (b === "_legacy") return -1;
        return a.localeCompare(b, "pt-BR", { numeric: true });
      });
      csv += "Quarteirão,R,C,TB,PE,O,Total\n";
      const g = { R:0,C:0,TB:0,PE:0,O:0,Total:0 };
      chaves.forEach(q => {
        const d = gerais[q];
        g.R+=d.R; g.C+=d.C; g.TB+=d.TB; g.PE+=d.PE; g.O+=d.O; g.Total+=d.total;
        csv += `"${q === "_legacy" ? "(legado)" : q}",${d.R},${d.C},${d.TB},${d.PE},${d.O},${d.total}\n`;
      });
      csv += `"TOTAL",${g.R},${g.C},${g.TB},${g.PE},${g.O},${g.Total}\n`;
    }

    csv += `\n\n=== COFLAGRADOS ===\n\n`;
    {
      const reg = dadosFormularios.coflagrados || {};
      const chaves = Object.keys(reg).sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
      csv += "Chave,Quarteirão,R,C,TB,PE,O\n";
      chaves.forEach(k => {
        const l = reg[k] || {};
        if (l.q || l.r || l.c || l.tb || l.pe || l.o) {
          csv += `"${k}","${l.q || ""}","${l.r || ""}","${l.c || ""}","${l.tb || ""}","${l.pe || ""}","${l.o || ""}"\n`;
        }
      });
    }

    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `diario_producao_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ===== Inicialização =====
  carregarStatus();
  carregarPaginas();
  carregarCabecalhos();
  carregarRodapes();
  carregarFormularios();

  if (!carregar()) criarSemana();

  garantirEstruturaBoletins();
  aplicarFormatacaoInicialNosInputsNumericos(document);

  recalcular();
  atualizarResumoSemanal();
  atualizarTotalImoveis();
  atualizarInformados();
  atualizarAndamento();
  atualizarConcluidos();
  renderizarFormularioBoletins();
  renderizarResumoIntegrado();
  renderizarBasesIntegrado();
  renderizarCoflagrados();
  renderizarResumoGeral();

  document.addEventListener('paste', function(event) {
    const target = event.target;
    if (!(target instanceof HTMLInputElement)) return;
    if (target.dataset.boletinsImovel === '1') {
      tratarColagemBoletins(event);
      return;
    }
    if (target.dataset.tipo === 'coflagrados') {
      tratarColagemCoflagrados(event);
      return;
    }
  });

  monitorarConexaoNuvem();
</script>

</body>
</html>
